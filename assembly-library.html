<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NW Field">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0696D7">
<title>Cost Catalog — Northern Wolves AC</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="procore-ui.css?v=332">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=332"></script>
<script src="auth.js?v=332"></script>
<script src="procore-ui.js?v=332"></script>
<script src="nw-catalog-picker.js?v=332"></script>
<style>
  /* ── Cost Catalog page (Procore "Select catalog item" layout, rendered in-page) ── */
  .pc-page [hidden] { display: none !important; }
  .cc-wrap { padding-top: 16px; padding-bottom: 24px; }
  .cc-sub { font-size: 13px; color: var(--pc-muted); font-weight: 400; margin-left: 10px; white-space: nowrap; }
  #catalogBanner { margin-bottom: 12px; }
  #catalogBanner a { color: inherit; text-decoration: underline; font-weight: 600; }
  #catalogMount.ncp-mount { height: calc(100vh - 215px); min-height: 520px; }
  #catalogMount .ncp-left { width: 280px; }
  .cc-bulk {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    background: var(--pc-link-bg); border: 1px solid #c7d7f5; border-radius: var(--pc-radius);
    padding: 6px 8px 6px 12px; margin-bottom: 10px;
  }
  .cc-bulk .n { font-weight: 600; color: var(--pc-link); }
  .cc-bulk .sp { flex: 1; }
  .cc-bulk .pc-btn { background: #fff; }
  .cc-bulk .pc-btn.danger { color: var(--pc-danger); border-color: var(--pc-danger); }
  .cc-bulk .pc-btn.danger:hover { background: #fee2e2; }
  .cc-empty { padding: 48px 20px; text-align: center; color: var(--pc-muted); }
  .cc-empty .t { color: var(--pc-text); font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  @media (max-width: 760px) {
    #catalogMount .ncp-left { width: 200px; }
    .pc-title-row { flex-wrap: wrap; }
    .cc-sub { display: none; }
  }
</style>
</head>
<body class="pc-page">

<div id="nwHeader"></div>

<div class="pc-page-head">
  <div class="pc-crumb">
    <a href="index.html">Home</a><span class="sep"></span>
    <a href="bid-board.html">Bid Board</a><span class="sep"></span>
    <span>Cost Catalog</span>
  </div>
  <div class="pc-title-row no-tabs">
    <h1 class="pc-h1">Cost Catalog</h1>
    <span class="pc-pill pc-pill-locked" id="readonlyBadge" hidden>Read-only</span>
    <span class="cc-sub" id="catalogSub">Company cost catalog — parts, assemblies and NWAC standard rates used by Takeoff and Estimating</span>
    <div class="pc-title-actions">
      <button type="button" class="pc-btn pc-btn-outline" id="btnNewFolder" hidden></button>
      <button type="button" class="pc-btn pc-btn-primary" id="btnNew" hidden></button>
    </div>
  </div>
</div>

<div class="pc-wrap cc-wrap">
  <div id="catalogBanner" hidden></div>

  <div class="cc-bulk" id="bulkBar" hidden>
    <span class="n" id="bulkCount">0 selected</span>
    <button type="button" class="pc-btn pc-btn-icon pc-btn-ghost" id="bulkClear" title="Clear selection"></button>
    <span class="sp"></span>
    <button type="button" class="pc-btn pc-btn-outline" id="bulkMove"></button>
    <button type="button" class="pc-btn pc-btn-outline danger" id="bulkDelete"></button>
  </div>

  <div class="pc-card" id="catalogMount"></div>
</div>

<script>
requireAuth().catch(function(){});
(function() {
  'use strict';

  // Same roles as PC.MGMT_ROLES (procore-ui.js); local copy only used when PC is not loaded.
  var MGMT_ROLES = ['admin','manager','lead_pm','project_manager','apm','estimator'];

  // Exact <header class="dash-header"> block from index.html — used when PC.nwHeaderHtml is unavailable.
  var FALLBACK_HEADER =
    '<header class="dash-header">' +
      '<div class="header-top">' +
        '<a class="dash-header-left" href="index.html">' +
          '<img class="dash-header-logo" src="logo-header.png?v=258" alt="Northern Wolves Air Conditioning">' +
          '<div class="dash-header-wordmark">Northern Wolves <span>Field</span></div>' +
        '</a>' +
        '<ul class="nav-menu" id="navMenu"></ul>' +
        '<a class="nav-ic" href="support.html" title="AI Support" aria-label="AI Support"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9c0 1.6.4 3.1 1.2 4.4L3 21l4.7-1.2A9 9 0 1 0 12 3z"/><path d="M9 12h.01M12 12h.01M15 12h.01"/></svg></a>' +
        '<div style="position:relative">' +
          '<div class="profile-circle" id="profileCircle" title="Profile" onclick="document.getElementById(\'profileDropdown\').classList.toggle(\'show\')">?</div>' +
          '<div class="profile-dropdown" id="profileDropdown">' +
            '<div class="profile-dd-name" id="profileName">Loading...</div>' +
            '<div class="profile-dd-role" id="profileRole">tech</div>' +
            '<div class="profile-dd-email" id="profileEmail"></div>' +
            '<div class="profile-dd-divider"></div>' +
            '<button class="profile-dd-logout" onclick="logout()">Log Out</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tline" aria-hidden="true"></div>' +
    '</header>';

  var canEdit = false;
  var panel = null;
  var $ = function(id) { return document.getElementById(id); };

  function icon(name, size) { return (window.PC && PC.icon) ? PC.icon(name, size || 18) : ''; }
  function toast(msg, type) {
    if (window.PC && PC.toast) PC.toast(msg, type || 'info');
    else if (type === 'error') console.error(msg); else console.log(msg);
  }
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();

  async function init() {
    // NW logo header (same markup as index.html)
    $('nwHeader').innerHTML = (window.PC && typeof PC.nwHeaderHtml === 'function') ? PC.nwHeaderHtml() : FALLBACK_HEADER;
    if (typeof initAuthUI === 'function') {
      try { var p = initAuthUI(); if (p && p.catch) p.catch(function(e) { console.warn(e); }); } catch (e) { console.warn(e); }
    }
    // Close the profile dropdown on an outside click (same handler as index.html / PC.mountHeader)
    document.addEventListener('click', function(ev) {
      var dd = $('profileDropdown');
      if (dd && dd.classList.contains('show') && !ev.target.closest('#profileCircle') && !dd.contains(ev.target)) dd.classList.remove('show');
    });

    // Role gate — management + estimators edit, everyone else reads
    try {
      var profile = (typeof getAuthProfile === 'function') ? await getAuthProfile() : null;
      if (window.PC && typeof PC.canEdit === 'function') canEdit = !!PC.canEdit(profile);
      else canEdit = !!(profile && MGMT_ROLES.indexOf(profile.role) >= 0);
    } catch (e) { console.warn(e); canEdit = false; }

    // Header buttons
    $('btnNew').innerHTML = icon('add', 18) + ' Create New Item';
    $('btnNewFolder').innerHTML = icon('create_new_folder', 18) + ' New folder';
    $('bulkClear').innerHTML = icon('close', 16);
    $('bulkMove').innerHTML = icon('folder_open', 18) + ' Move to folder ' + icon('expand_more', 16);
    $('bulkDelete').innerHTML = icon('delete', 18) + ' Delete';

    if (!canEdit) {
      $('readonlyBadge').hidden = false;
    } else {
      $('btnNew').hidden = false;
      $('btnNewFolder').hidden = false;
    }

    if (!window.NWCatalogPicker) {
      $('catalogMount').innerHTML = '<div class="cc-empty"><div class="t">Cost Catalog component did not load</div>nw-catalog-picker.js is missing — reload the page (Ctrl+Shift+R).</div>';
      return;
    }

    bindEvents();

    panel = NWCatalogPicker.mount($('catalogMount'), {
      admin: canEdit,
      legacy: true,                 // 'Legacy assemblies (read-only)' virtual folder at the bottom of the tree
      onSelectionChange: updateBulkBar,
      onReady: renderBanner
    });
  }

  function bindEvents() {
    $('btnNew').addEventListener('click', function() {
      if (!canEdit) { toast('Read-only', 'error'); return; }
      NWCatalogPicker.openItemDialog(null, function(row) {
        if (row && row.id != null) NWCatalogPicker.pushMru(row.id);
        if (panel) panel.reload();
      });
    });
    $('btnNewFolder').addEventListener('click', function() {
      if (!canEdit || !panel) return;
      panel.newFolder();
    });
    $('bulkClear').addEventListener('click', function() { if (panel) panel.clearSelection(); });
    $('bulkMove').addEventListener('click', function(e) {
      e.stopPropagation();
      if (!canEdit || !panel) return;
      panel.bulkMove(this);
    });
    $('bulkDelete').addEventListener('click', function() {
      if (!canEdit || !panel) return;
      panel.bulkDelete();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && panel && !document.querySelector('.pc-backdrop') && !document.querySelector('.pc-menu')) {
        var rows = panel.selectedRows();
        if (rows.length) panel.clearSelection();
      }
    });
  }

  function updateBulkBar(rows) {
    rows = rows || [];
    var bar = $('bulkBar');
    if (!canEdit || !rows.length) { bar.hidden = true; return; }
    $('bulkCount').textContent = rows.length + ' selected';
    bar.hidden = false;
  }

  // info.catalog = 'catalog' | 'assemblies'; info.folders = folder count; info.legacy = estimate_assemblies rows
  function renderBanner(info) {
    var b = $('catalogBanner');
    info = info || {};
    if (info.catalog !== 'catalog') {
      b.className = 'pc-banner-warn';
      b.innerHTML = icon('info', 18) + '<div><b>The Procore Cost Catalog is not imported yet</b> — this page is showing the legacy Assembly Library instead. ' +
        'Run <code>takeoff-v2-schema.sql</code> in Supabase and import the Procore catalog on ' +
        '<a href="est-import.html">est-import.html</a>. Items created here meanwhile are saved to the Assembly Library.</div>';
      b.hidden = false;
      $('catalogSub').textContent = 'Legacy Assembly Library (estimate_assemblies) — import the Procore catalog to switch';
      return;
    }
    if (info.folders === 0) {
      b.className = 'pc-banner-info';
      b.innerHTML = icon('info', 18) + '<div>The catalog has no folders yet. Import the Procore folder tree on <a href="est-import.html">est-import.html</a>' +
        (canEdit ? ', or use <b>New folder</b> to create <b>Custom</b>, <b>NWAC Standards</b> and <b>NW Assemblies</b>' : '') +
        '. Items created meanwhile are filed under the <b>Custom</b> node in the tree.</div>';
      b.hidden = false;
      return;
    }
    if (info.legacy > 0) {
      b.className = 'pc-banner-info';
      b.innerHTML = icon('info', 18) + '<div>' + escHtml(String(info.legacy)) + ' legacy assembl' + (info.legacy === 1 ? 'y is' : 'ies are') +
        ' shown read-only under <b>Legacy assemblies</b> at the bottom of the tree. They are not migrated automatically — recreate the ones still in use with <b>Create New Item</b> (e.g. in an <b>NW Assemblies</b> folder).</div>';
      b.hidden = false;
      return;
    }
    b.hidden = true;
  }
})();
</script>
<script src="sw-register.js?v=332"></script>
</body>
</html>
