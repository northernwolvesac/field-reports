<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NW Field">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0696D7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=52"></script>
  <script src="auth.js?v=52"></script>
  <title>Northern Wolves AC — Field Reports</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Northern Wolves — Home
       Apple.com-inspired: quiet neutral canvas, one type family,
       generous air, hairline dividers, restrained accent.
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg:        #f5f5f7;   /* canvas */
      --surface:   #ffffff;   /* cards, nav */
      --ink:       #1d1d1f;   /* primary text */
      --ink-2:     #6e6e73;   /* secondary text */
      --ink-3:     #86868b;   /* tertiary text */
      --hair:      rgba(0,0,0,0.08);
      --accent:    #0071e3;   /* links / primary action */
      --accent-ink:#0066cc;
      --brand:     #0696D7;   /* Northern Wolves blue — used sparingly */
      --radius:    18px;
      --nav-h:     52px;
      --shadow-1:  0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04);
      --shadow-2:  0 10px 30px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg) !important;
      font-family: var(--font) !important;
      margin: 0 !important;
      min-height: 100vh !important;
      color: var(--ink) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
    }
    a { color: var(--accent-ink); }

    /* ═══ NAV BAR (slim, translucent) ═══ */
    .dash-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.72);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--hair);
    }
    .header-top {
      height: var(--nav-h);
      max-width: 980px; margin: 0 auto; padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-header-left { display: flex; align-items: center; gap: 10px; }
    .dash-header-logo { height: 30px; width: auto; display: block; }
    .dash-header-wordmark {
      font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
    }
    .dash-header-wordmark span { color: var(--ink-3); font-weight: 400; }

    .profile-circle {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--ink); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
      transition: transform .15s ease, opacity .15s ease; user-select: none;
    }
    .profile-circle:hover { opacity: .85; }
    .profile-circle:active { transform: scale(.94); }
    .profile-circle.empty { background: #e8e8ed; }
    .profile-circle.empty svg { width: 16px; height: 16px; fill: var(--ink-2); }

    .profile-dropdown {
      display: none; position: absolute; right: 0; top: 44px; min-width: 240px;
      background: var(--surface); border: 1px solid var(--hair); border-radius: 14px;
      box-shadow: var(--shadow-2); padding: 14px 16px; z-index: 300;
    }
    .profile-dropdown.show { display: block; }
    .profile-dd-name  { font-size: 15px; font-weight: 600; color: var(--ink); }
    .profile-dd-role  { font-size: 12px; color: var(--ink-3); text-transform: capitalize; margin-top: 2px; }
    .profile-dd-email { font-size: 12px; color: var(--ink-2); margin-top: 6px; word-break: break-all; }
    .profile-dd-divider { height: 1px; background: var(--hair); margin: 12px 0; }
    .profile-dd-logout {
      width: 100%; padding: 9px 12px; border: 1px solid var(--hair); background: #fff;
      color: #c0392b; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .profile-dd-logout:hover { background: #fff5f5; }

    /* ═══ HERO ═══ */
    .hero-greeting {
      max-width: 980px; margin: 0 auto; padding: 56px 22px 28px;
    }
    .hero-greeting h1 {
      font-size: clamp(32px, 4.6vw, 48px); line-height: 1.08; font-weight: 600;
      letter-spacing: -0.028em; color: var(--ink); margin: 0 0 8px;
    }
    .hero-greeting p {
      font-size: 17px; line-height: 1.4; color: var(--ink-2); margin: 0; font-weight: 400;
    }

    /* ═══ SECTIONS ═══ */
    .grid-container, .activity-feed, .section-title { max-width: 980px; margin-left: auto; margin-right: auto; }
    .grid-container { padding: 0 22px 40px; }
    .grid-label, .section-title h2 {
      font-size: 21px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink);
      text-transform: none; margin: 0;
    }
    .grid-label { margin: 36px 0 14px; padding-top: 22px; border-top: 1px solid var(--hair); }
    .grid-label:first-child { margin-top: 8px; padding-top: 0; border-top: none; }
    .section-title {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 0 22px; margin-top: 8px; margin-bottom: 14px;
    }
    .section-title a { font-size: 14px; font-weight: 500; color: var(--accent-ink); text-decoration: none; }
    .section-title a:hover { text-decoration: underline; }

    /* ═══ CARD GRID ═══ */
    .report-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    @media (max-width: 860px) { .report-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 440px) { .report-grid { grid-template-columns: 1fr; } }

    .report-card {
      position: relative; display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
      padding: 18px 18px 18px 16px; text-decoration: none; color: inherit;
      box-shadow: var(--shadow-1);
      transition: transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease, border-color .22s ease;
      animation: card .45s cubic-bezier(.2,.7,.2,1) both;
    }
    .report-card:active { transform: scale(.985); }
    @media (hover: hover) {
      .report-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: rgba(0,0,0,0.12); }
      .report-card:hover .report-card-arrow { color: var(--ink); transform: translateX(2px); }
    }
    .report-card-icon {
      width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      background: var(--icon-bg, #f5f5f7);
    }
    .report-card-info { flex: 1; min-width: 0; }
    .report-card-title { font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.012em; line-height: 1.25; }
    .report-card-desc  { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
    .report-card-arrow { color: var(--ink-3); font-size: 22px; line-height: 1; transition: transform .2s ease, color .2s ease; }
    .report-card-badge {
      position: absolute; top: 12px; right: 40px; min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: 10px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    @keyframes card { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .report-card:nth-child(1) { animation-delay: .02s; } .report-card:nth-child(2) { animation-delay: .05s; }
    .report-card:nth-child(3) { animation-delay: .08s; } .report-card:nth-child(4) { animation-delay: .11s; }
    .report-card:nth-child(5) { animation-delay: .14s; } .report-card:nth-child(6) { animation-delay: .17s; }
    .report-card:nth-child(7) { animation-delay: .20s; } .report-card:nth-child(8) { animation-delay: .23s; }
    .report-card:nth-child(9) { animation-delay: .26s; } .report-card:nth-child(10){ animation-delay: .29s; }
    .report-card:nth-child(11){ animation-delay: .32s; } .report-card:nth-child(12){ animation-delay: .35s; }

    /* ═══ FEATURED (AI Support) ═══ */
    .support-card-wrap { margin-top: 36px; }
    .support-card {
      display: flex; align-items: center; gap: 18px;
      background: var(--ink); color: #fff; border-radius: var(--radius);
      padding: 22px 24px; text-decoration: none;
      transition: transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease;
    }
    @media (hover: hover) { .support-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); } }
    .support-card-icon { font-size: 30px; width: 54px; height: 54px; border-radius: 14px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .support-card-info { flex: 1; min-width: 0; }
    .support-card-title { font-size: 19px; font-weight: 600; letter-spacing: -0.015em; }
    .support-card-desc  { font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 3px; }
    .support-card-arrow { color: rgba(255,255,255,0.6); font-size: 24px; }

    /* ═══ ACTIVITY / MY JOBS ═══ */
    .activity-feed { padding: 0 22px; }
    .activity-item-wrap { position: relative; }
    .activity-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--hair); border-radius: 16px;
      padding: 14px 16px; margin-bottom: 10px; text-decoration: none; color: inherit;
      box-shadow: var(--shadow-1); transition: transform .2s ease, box-shadow .2s ease;
    }
    .activity-item:active { transform: scale(.985); }
    @media (hover: hover) { .activity-item:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); } }
    .activity-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .activity-info { flex: 1; min-width: 0; }
    .activity-title { font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-customer { font-size: 13px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-meta { text-align: right; flex-shrink: 0; }
    .activity-time { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .activity-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; margin-top: 4px; letter-spacing: 0; }
    .activity-badge.draft { background: #fff4e0; color: #9a5b00; }
    .activity-badge.completed { background: #e6f6ea; color: #1d7a3a; }
    .delete-draft-btn {
      position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border: none;
      background: #f2f2f4; color: var(--ink-2); border-radius: 50%; font-size: 15px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
    }
    .delete-draft-btn:hover { background: #fde8e8; color: #c0392b; }
    .activity-empty {
      text-align: center; padding: 36px 16px; color: var(--ink-3); font-size: 14px;
      background: var(--surface); border-radius: 16px; border: 1px solid var(--hair);
    }
    .activity-empty-icon { font-size: 30px; margin-bottom: 8px; }

    /* ═══ INSTALL BANNER ═══ */
    .install-banner {
      display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      width: min(96vw, 720px);
      background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--shadow-2);
      padding: 12px 14px; z-index: 200; align-items: center; gap: 12px;
    }
    .install-banner.visible { display: flex; }
    .install-banner-icon { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; }
    .install-banner-text { flex: 1; min-width: 0; }
    .install-banner-title { font-size: 14px; font-weight: 600; color: var(--ink); }
    .install-banner-desc { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .install-banner .btn-install {
      background: var(--accent); color: #fff; border: none; border-radius: 999px;
      padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .install-banner .btn-install:hover { background: var(--accent-ink); }
    .install-banner .btn-dismiss { background: none; border: none; color: var(--ink-3); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0; }

    /* ═══ FOOTER ═══ */
    .dash-footer {
      max-width: 980px; margin: 0 auto; padding: 24px 22px 40px;
      border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink-3);
    }

    @media (prefers-reduced-motion: reduce) { .report-card, .support-card, .activity-item { animation: none; transition: none; } }
  </style>
</head>
<body>

  <!-- Header with Hero -->
  <header class="dash-header">
    <div class="header-top">
      <div class="dash-header-left">
        <img class="dash-header-logo" src="logo-header.png" alt="Northern Wolves AC">
        <div class="dash-header-wordmark">Northern Wolves <span>Field</span></div>
      </div>
      <div style="position:relative">
        <div class="profile-circle" id="profileCircle" title="Profile" onclick="document.getElementById('profileDropdown').classList.toggle('show')">?</div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="profile-dd-name" id="profileName">Loading...</div>
          <div class="profile-dd-role" id="profileRole">tech</div>
          <div class="profile-dd-email" id="profileEmail"></div>
          <div class="profile-dd-divider"></div>
          <button class="profile-dd-logout" onclick="logout()">Log Out</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero-greeting">
    <h1 id="heroGreeting">Good morning</h1>
    <p id="heroDate"></p>
  </section>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <img class="install-banner-icon" src="icon-192.png" alt="NW">
    <div class="install-banner-text">
      <div class="install-banner-title">Install Northern Wolves Field Reports</div>
      <div class="install-banner-desc">Quick access from your home screen</div>
    </div>
    <button class="btn-install" id="installBtn">Install</button>
    <button class="btn-dismiss" id="dismissInstall" aria-label="Dismiss">&times;</button>
  </div>

  <!-- My Dispatches -->
  <div class="section-title" id="dispatchSection" style="display:none">
    <h2>My Jobs</h2>
    <a href="dispatch.html">View All &rarr;</a>
  </div>
  <div class="activity-feed" id="dispatchFeed"></div>

  <!-- Card Grids -->
  <div class="grid-container">
    <div class="grid-label">Reports</div>
    <div class="report-grid" id="reportGrid"></div>

    <div class="grid-label">Tools</div>
    <div class="report-grid" id="toolsGrid"></div>

    <div class="support-card-wrap" id="supportWrap"></div>
  </div>

  <!-- Footer -->
  <div class="dash-footer">Northern Wolves Air Conditioning &mdash; NY &amp; NJ</div>

<script>
(async function() {
  // ===== AUTH GUARD =====
  try { await requireAuth(); } catch(e) { return; }
  await initAuthUI();

  // Close profile dropdown on outside click
  document.addEventListener('click', function(e) {
    var dd = document.getElementById('profileDropdown');
    var circle = document.getElementById('profileCircle');
    if (dd && !dd.contains(e.target) && e.target !== circle) {
      dd.classList.remove('show');
    }
  });
  // ===== CONSTANTS =====
  var DRAFTS_KEY = 'nw_drafts';
  var HISTORY_KEY = 'nw_history';
  var PROFILE_KEY = 'nw_tech_profile';

  // ===== HELPER FUNCTIONS =====

  function getDrafts() {
    try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function getProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null'); }
    catch(e) { return null; }
  }

  function relativeTime(isoString) {
    if (!isoString) return '';
    var now = Date.now();
    var then = new Date(isoString).getTime();
    var diffMs = now - then;
    if (isNaN(diffMs) || diffMs < 0) return '';

    var seconds = Math.floor(diffMs / 1000);
    var minutes = Math.floor(seconds / 60);
    var hours = Math.floor(minutes / 60);
    var days = Math.floor(hours / 24);

    if (seconds < 60) return 'Just now';
    if (minutes < 60) return minutes + 'm ago';
    if (hours < 24) return hours + 'h ago';
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd ago';

    var d = new Date(isoString);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }

  function getReportTypeIcon(type) {
    var icons = {
      'service-call': '\uD83D\uDD27',
      'startup': '\uD83D\uDE80',
      'site-survey': '\uD83D\uDCCB',
      'pm-checklist': '\u2705',
      'work-order': '\uD83D\uDCDD',
      'change-order': '\uD83D\uDCCB',
      'rfi': '\u2753'
    };
    return icons[type] || '\uD83D\uDCCB';
  }

  function getReportTypeLabel(type) {
    var labels = {
      'service-call': 'Service Call',
      'startup': 'Start-Up Report',
      'site-survey': 'Site Survey',
      'pm-checklist': 'Maintenance',
      'work-order': 'Work Order',
      'change-order': 'Change Order',
      'rfi': 'RFI'
    };
    return labels[type] || type || 'Report';
  }

  function getFormPage(type) {
    var pages = {
      'service-call': 'service-call-report.html',
      'startup': 'startup-report.html',
      'site-survey': 'site-survey-report.html',
      'pm-checklist': 'pm-checklist.html',
      'work-order': 'work-order.html',
      'change-order': 'change-order.html',
      'rfi': 'rfi.html'
    };
    return pages[type] || '#';
  }

  function isThisWeek(isoString) {
    if (!isoString) return false;
    var d = new Date(isoString);
    var now = new Date();
    var startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());
    startOfWeek.setHours(0, 0, 0, 0);
    var endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 7);
    return d >= startOfWeek && d < endOfWeek;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ===== HERO GREETING =====
  function renderHero() {
    var hour = new Date().getHours();
    var greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    var profileName = document.getElementById('profileName').textContent || '';
    var firstName = '';
    if (profileName && profileName !== 'Loading...') {
      firstName = profileName.split(' ')[0];
    }
    document.getElementById('heroGreeting').textContent = firstName ? greeting + ', ' + firstName : greeting;

    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var now = new Date();
    document.getElementById('heroDate').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
  }


  // ===== ACTIVITY FEED =====
  function renderActivity() {
    var drafts = getDrafts();
    var history = getHistory();
    var container = document.getElementById('activityFeed');

    var items = [];
    drafts.forEach(function(d) {
      items.push({
        id: d.id,
        type: d.type,
        title: d.title || getReportTypeLabel(d.type),
        customer: d.customer || '',
        time: d.lastModified,
        status: 'draft',
        formPage: d.formPage || getFormPage(d.type)
      });
    });
    history.forEach(function(h) {
      items.push({
        id: h.id,
        type: h.type,
        title: h.title || getReportTypeLabel(h.type),
        customer: h.customer || '',
        time: h.completedAt,
        status: 'completed',
        formPage: null
      });
    });

    items.sort(function(a, b) {
      var tA = a.time ? new Date(a.time).getTime() : 0;
      var tB = b.time ? new Date(b.time).getTime() : 0;
      return tB - tA;
    });

    var recent = items.slice(0, 5);

    if (recent.length === 0) {
      container.innerHTML =
        '<div class="activity-empty">' +
          '<div class="activity-empty-icon">\uD83D\uDCCB</div>' +
          'No reports yet \u2014 tap a form below to get started' +
        '</div>';
      return;
    }

    var html = '';
    recent.forEach(function(item) {
      var href = '';
      if (item.status === 'draft' && item.formPage) {
        href = item.formPage + '?draft=' + encodeURIComponent(item.id);
      } else if (item.status === 'draft') {
        href = getFormPage(item.type) + '?draft=' + encodeURIComponent(item.id);
      } else {
        href = 'history.html';
      }

      var deleteBtn = item.status === 'draft'
        ? '<button class="delete-draft-btn" data-draft-id="' + escapeHtml(item.id) + '" title="Delete draft">&times;</button>'
        : '';

      html +=
        '<div class="activity-item-wrap">' +
        '<a class="activity-item" href="' + escapeHtml(href) + '">' +
          '<div class="activity-icon">' + getReportTypeIcon(item.type) + '</div>' +
          '<div class="activity-info">' +
            '<div class="activity-title">' + escapeHtml(item.title) + '</div>' +
            '<div class="activity-customer">' + escapeHtml(item.customer || getReportTypeLabel(item.type)) + '</div>' +
          '</div>' +
          '<div class="activity-meta">' +
            '<div class="activity-time">' + relativeTime(item.time) + '</div>' +
            '<div class="activity-badge ' + item.status + '">' + item.status + '</div>' +
          '</div>' +
        '</a>' +
        deleteBtn +
        '</div>';
    });

    container.innerHTML = html;

    // Attach delete handlers
    container.querySelectorAll('.delete-draft-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var draftId = btn.getAttribute('data-draft-id');
        if (confirm('Delete this draft?')) {
          deleteDraft(draftId);
          renderStats();
          renderActivity();
        }
      });
    });
  }

  function deleteDraft(draftId) {
    var drafts = getDrafts();
    var filtered = drafts.filter(function(d) { return d.id !== draftId; });
    localStorage.setItem(DRAFTS_KEY, JSON.stringify(filtered));
    // Also remove saved form data
    localStorage.removeItem('nw_draft_' + draftId);
  }

  // ===== REPORT GRID =====
  function renderReportGrid() {
    var drafts = getDrafts();

    // Report forms — each card opens a list view (history.html?type=X)
    // with a big "+ New" button at the top and project folder grouping.
    var reportTypes = [
      { type: 'service-call', icon: '\uD83D\uDD27', title: 'Service Call', desc: 'Diagnosis, readings, parts, labor', page: 'history.html?type=service-call', accent: '#0696D7', iconBg: '#e0f2fe' },
      { type: 'startup', icon: '\uD83D\uDE80', title: 'Start-Up', desc: 'Cooling & heating commissioning', page: 'history.html?type=startup', accent: '#8b5cf6', iconBg: '#ede9fe' },
      { type: 'site-survey', icon: '\uD83D\uDCCB', title: 'Site Survey', desc: 'Equipment inventory & conditions', page: 'history.html?type=site-survey', accent: '#10b981', iconBg: '#d1fae5' },
      { type: 'pm-checklist', icon: '\u2705', title: 'Maintenance', desc: 'PM checklist by equipment type', page: 'history.html?type=pm-checklist', accent: '#f59e0b', iconBg: '#fef3c7' },
      { type: 'work-order', icon: '\uD83D\uDCDD', title: 'Work Order', desc: 'Parts, labor, cost tracking', page: 'history.html?type=work-order', accent: '#0696D7', iconBg: '#e0f2fe' }
    ];

    // Tool / management cards
    var toolTypes = [
      { type: 'schedule', icon: '\uD83D\uDCC5', title: 'Schedule', desc: '2-3 week look-ahead, all crews', page: 'schedule.html', accent: '#0696D7', iconBg: '#e0f2fe' },
      { type: 'field-orders', icon: '\uD83D\uDCE6', title: 'Field Orders', desc: 'Request materials from the field', page: 'field-orders.html', accent: '#0696D7', iconBg: '#e0f2fe' },
      { type: 'driver-schedule', icon: '\uD83D\uDE90', title: 'Delivery Schedule', desc: 'NW drivers + vendor deliveries', page: 'driver-schedule.html', accent: '#10b981', iconBg: '#d1fae5' },
      { type: 'dispatch', icon: '\uD83D\uDCE8', title: 'Dispatch', desc: 'Single-job emergency tickets', page: 'dispatch.html', accent: '#ef4444', iconBg: '#fee2e2' },
      { type: 'customers', icon: '\uD83C\uDFE2', title: 'Customers', desc: 'Shared customer database', page: 'customers.html', accent: '#0696D7', iconBg: '#e0f2fe' },
      { type: 'equipment', icon: '\u2699\uFE0F', title: 'Equipment', desc: 'Track units, warranties, service', page: 'equipment.html', accent: '#64748b', iconBg: '#f1f5f9' },
      { type: 'projects', icon: '\uD83D\uDCC1', title: 'Projects', desc: 'Shared docs & drawings', page: 'projects.html', accent: '#f59e0b', iconBg: '#fef3c7' },
      { type: 'workload', icon: '\uD83D\uDCC8', title: 'Workload Planner', desc: 'Capacity, timeline, staffing', page: 'workload.html', accent: '#8b5cf6', iconBg: '#ede9fe' },
      { type: 'estimating', icon: '\uD83D\uDCD0', title: 'Bid Board', desc: 'Invitations \u2192 Estimating \u2192 Submitted \u2192 Won', page: 'bid-board.html', accent: '#059669', iconBg: '#d1fae5' },
      { type: 'management', icon: '\uD83D\uDCCA', title: 'Management', desc: 'All reports & status', page: 'management.html', accent: '#8b5cf6', iconBg: '#ede9fe' },
      { type: 'history', icon: '\uD83D\uDCC3', title: 'Activity', desc: 'Drafts & completed reports', page: 'history.html', accent: '#10b981', iconBg: '#d1fae5' }
    ];

    var draftCounts = {};
    drafts.forEach(function(d) {
      if (d.type) {
        draftCounts[d.type] = (draftCounts[d.type] || 0) + 1;
      }
    });

    function buildCards(items) {
      var html = '';
      items.forEach(function(r) {
        var count = draftCounts[r.type] || 0;
        var badgeHtml = count > 0
          ? '<div class="report-card-badge">' + count + '</div>'
          : '';
        html +=
          '<a class="report-card" href="' + r.page + '" style="--card-accent:' + r.accent + ';--icon-bg:' + r.iconBg + '">' +
            badgeHtml +
            '<div class="report-card-icon">' + r.icon + '</div>' +
            '<div class="report-card-info">' +
              '<div class="report-card-title">' + r.title + '</div>' +
              '<div class="report-card-desc">' + r.desc + '</div>' +
            '</div>' +
            '<span class="report-card-arrow">\u203A</span>' +
          '</a>';
      });
      return html;
    }

    document.getElementById('reportGrid').innerHTML = buildCards(reportTypes);
    document.getElementById('toolsGrid').innerHTML = buildCards(toolTypes);

    // Support card (featured)
    document.getElementById('supportWrap').innerHTML =
      '<a class="support-card" href="support.html">' +
        '<div class="support-card-icon">\uD83E\uDD16</div>' +
        '<div class="support-card-info">' +
          '<div class="support-card-title">AI Support</div>' +
          '<div class="support-card-desc">HVAC troubleshooting & app help \u2014 available 24/7</div>' +
        '</div>' +
        '<span class="support-card-arrow">\u203A</span>' +
      '</a>';
  }

  // ===== PROFILE (handled by auth.js) =====

  // ===== INSTALL PROMPT =====
  var deferredPrompt = null;
  var installBanner = document.getElementById('installBanner');
  var installBtn = document.getElementById('installBtn');
  var dismissBtn = document.getElementById('dismissInstall');

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('nw_install_dismissed')) {
      installBanner.classList.add('visible');
    }
  });

  installBtn.addEventListener('click', function() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(result) {
        deferredPrompt = null;
        installBanner.classList.remove('visible');
      });
    }
  });

  dismissBtn.addEventListener('click', function() {
    installBanner.classList.remove('visible');
    localStorage.setItem('nw_install_dismissed', '1');
  });

  // iOS install detection
  function checkiOSInstall() {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone === true;
    if (isIOS && !isStandalone && !deferredPrompt && !localStorage.getItem('nw_install_dismissed')) {
      var banner = document.getElementById('installBanner');
      var btn = document.getElementById('installBtn');
      btn.textContent = 'How to Install';
      btn.addEventListener('click', function iosHandler() {
        btn.removeEventListener('click', iosHandler);
        alert('To install: tap the Share button in Safari, then tap "Add to Home Screen".');
        banner.classList.remove('visible');
        localStorage.setItem('nw_install_dismissed', '1');
      }, { once: true });
      banner.classList.add('visible');
    }
  }

  // ===== DISPATCH INBOX =====
  async function renderDispatches() {
    if (typeof getDispatches !== 'function' || typeof getCurrentUser !== 'function') return;
    try {
      var userRes = await getCurrentUser();
      if (!userRes.data) return;
      var res = await getDispatches({ assigned_to: userRes.data.id, not_status: 'completed', limit: 5 });
      var jobs = (res.data || []).filter(function(d) { return d.status !== 'cancelled'; });
      if (jobs.length === 0) return;

      document.getElementById('dispatchSection').style.display = 'flex';
      var container = document.getElementById('dispatchFeed');
      var priorityIcons = { critical: '\uD83D\uDD34', high: '\uD83D\uDFE0', standard: '\uD83D\uDD35', low: '\u26AA' };
      var html = '';
      jobs.forEach(function(d) {
        html += '<a class="activity-item" href="dispatch.html">' +
          '<div class="activity-icon">' + (priorityIcons[d.priority] || '\uD83D\uDD35') + '</div>' +
          '<div class="activity-info">' +
            '<div class="activity-title">' + escapeHtml(d.title) + '</div>' +
            '<div class="activity-customer">' + escapeHtml(d.customer_name || d.address || 'No location') + '</div>' +
          '</div>' +
          '<div class="activity-meta">' +
            (d.scheduled_date ? '<div class="activity-time">' + d.scheduled_date.substring(5).replace('-','/') + '</div>' : '') +
            '<div class="activity-badge ' + (d.status === 'pending' ? 'draft' : 'completed') + '">' + (d.status || 'pending') + '</div>' +
          '</div>' +
        '</a>';
      });
      container.innerHTML = html;
    } catch(e) {
      console.error('[dashboard] dispatch load error:', e);
    }
  }

  // ===== INIT =====
  renderHero();
  renderReportGrid();
  renderDispatches();

  // Hide management + workload + invoicing + estimating cards for techs
  getAuthProfile().then(function(profile) {
    if (profile && profile.role === 'tech') {
      ['management.html', 'workload.html', 'invoicing.html', 'estimating.html'].forEach(function(page) {
        var link = document.querySelector('a[href="' + page + '"]');
        if (link) link.style.display = 'none';
      });
    }
  }).catch(function(){});

  // Update hero once profile loads (auth.js sets profileName async)
  var heroObserver = new MutationObserver(function() { renderHero(); });
  var pnEl = document.getElementById('profileName');
  if (pnEl) heroObserver.observe(pnEl, { childList: true, characterData: true, subtree: true });

  // Delayed iOS check (wait for beforeinstallprompt to potentially fire)
  setTimeout(checkiOSInstall, 1000);
})();
</script>
<script src="sw-register.js?v=186"></script>
</body>
