<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NW Field">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js?v=52"></script>
  <script src="auth.js?v=52"></script>
  <title>Northern Wolves AC — Field Reports</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Northern Wolves — Home
       Architectural minimalism: charcoal graphite canvas (70%),
       platinum white type (20%), matte-silver hairlines (10%).
       One type family, light weights, numbered sections, no cards.
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg:        #ffffff;                 /* white canvas */
      --bg-2:      #f7f8fa;                 /* nav, panels */
      --bg-3:      #eef0f3;                 /* hover cells */
      --ink:       #111318;                 /* graphite type */
      --ink-2:     #4b5563;                 /* secondary text */
      --ink-3:     #8a919b;                 /* muted */
      --line:      rgba(17,19,24,0.12);     /* hairline */
      --line-2:    rgba(17,19,24,0.28);     /* stronger hairline */
      --nav-h:     60px;
      --ice:       #8FD3FF;                 /* cooling */
      --amb:       #F5A524;                 /* heating */
      --t1: 55%; --t2: 100%;                /* temperature line stops (set per season) */
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      background: var(--bg) !important; color: var(--ink) !important;
      font-family: var(--font) !important; margin: 0 !important; min-height: 100vh !important;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; letter-spacing: -0.005em;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

    /* ═══ WATERMARK ═══ */
    .wm { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 0; }
    .wm img { width: min(43vh, 48vw); height: auto; opacity: 0.16; }
    .page { position: relative; z-index: 1; }

    /* ═══ NAV ═══ */
    .dash-header {
      position: sticky; top: 0; z-index: 100; height: var(--nav-h);
      background: rgba(255,255,255,0.88); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .header-top { max-width: 1080px; margin: 0 auto; height: 100%; display: flex; align-items: center; padding: 0 28px; gap: 6px; }
    .dash-header-left { display: flex; align-items: center; gap: 12px; margin-right: auto; }
    .tline { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--ice) var(--t1), var(--amb) var(--t2)); }
    .dash-header-logo { height: 50px; width: auto; display: block; }
    .dash-header-wordmark { display: none; }   /* the official logo already carries the company name */
    .dash-header-wordmark { font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); line-height: 1.2; }
    .dash-header-wordmark span { display: block; font-weight: 400; letter-spacing: 0.22em; color: var(--ink-3); font-size: 10px; }

    .nav-menu { display: flex; margin: 0; padding: 0; list-style: none; }
    .nav-menu > li { position: relative; }
    .nav-menu > li > a { display: block; padding: 0 16px; line-height: var(--nav-h); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); transition: color .2s; }
    .nav-menu > li:hover > a, .nav-menu > li:focus-within > a { color: var(--ink); }
    .nav-dd {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(-4px);
      min-width: 240px; background: rgba(255,255,255,0.97); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
      border: 1px solid var(--line); border-top: 0; padding: 14px 0 8px;
      opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease;
    }
    .nav-menu > li:hover .nav-dd, .nav-menu > li:focus-within .nav-dd { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .nav-dd small { display: block; padding: 0 22px 8px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
    .nav-dd a { display: block; padding: 9px 22px; font-size: 15px; color: var(--ink); border-top: 1px solid var(--line); }
    .nav-dd a:hover { background: var(--bg-3); }
    .nav-ic { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-2); }
    .nav-ic:hover { color: var(--ink); }
    .nav-ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

    .profile-circle {
      width: 34px; height: 34px; border-radius: 50%; margin-left: 6px;
      border: 1px solid var(--line-2); background: transparent; color: var(--ink);
      display: grid; place-items: center; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; cursor: pointer; user-select: none;
    }
    .profile-circle:hover { background: var(--bg-3); }
    .profile-circle.mgmt { border-color: var(--amb); }
    .profile-circle.tech { border-color: var(--ice); }
    .profile-dropdown {
      display: none; position: absolute; top: calc(100% + 10px); right: 0; min-width: 240px;
      background: rgba(255,255,255,0.98); border: 1px solid var(--line); padding: 16px 18px; z-index: 300;
    }
    .profile-dropdown.show { display: block; }
    .profile-dd-name  { font-size: 15px; font-weight: 500; color: var(--ink); }
    .profile-dd-role  { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
    .profile-dd-email { font-size: 12px; color: var(--ink-2); margin-top: 6px; word-break: break-all; }
    .profile-dd-divider { height: 1px; background: var(--line); margin: 14px 0 10px; }
    .profile-dd-logout {
      width: 100%; text-align: left; padding: 8px 0; background: none; border: none; cursor: pointer;
      font: inherit; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
    }
    .profile-dd-logout:hover { color: var(--ink); }

    /* ═══ GREETING ═══ */
    .hero-greeting { padding: 88px 0 40px; }
    .hero-greeting h1 { margin: 0; font-size: 60px; font-weight: 300; letter-spacing: -0.025em; line-height: 1.02; color: var(--ink); }
    .hero-greeting p { margin: 18px 0 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
    .season { color: var(--ice); } .season.heat { color: var(--amb); } .season.mid { color: var(--ink-2); } .season b { font-weight: 500; color: var(--ink-2); }

    /* ═══ MY JOBS (dispatch) ═══ */
    .section-title { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 0 0; border-top: 1px solid var(--line-2); }
    .section-title h2 { margin: 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 500; color: var(--ink-3); }
    .section-title a { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
    .section-title a:hover { color: var(--ink); }
    .activity-feed { margin: 12px 0 40px; }
    .activity-feed:empty { display: none; }
    .activity-item { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); color: var(--ink); }
    .activity-item:last-child { border-bottom: 1px solid var(--line); }
    .activity-item:hover { background: linear-gradient(90deg, var(--bg-3), transparent); }
    .activity-icon { width: 22px; text-align: center; font-size: 12px; flex-shrink: 0; filter: grayscale(1); opacity: .8; }
    .activity-info { flex: 1; min-width: 0; }
    .activity-title { font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-customer { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
    .activity-meta { text-align: right; flex-shrink: 0; }
    .activity-time { font-size: 12px; color: var(--ink-3); }
    .activity-badge { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }

    /* ═══ FOLDERS ═══ */
    .folders { padding: 8px 0 72px; }
    .folder { position: relative; display: grid; grid-template-columns: 64px 1fr 1.35fr; gap: 24px 32px; align-items: start; padding: 38px 0 42px; border-top: 1px solid var(--line-2); }
    .folder .stripe { position: absolute; left: -28px; top: 38px; bottom: 42px; width: 2px; }
    .folder:last-child { border-bottom: 1px solid var(--line-2); }
    .folder-num { font-size: 12px; letter-spacing: 0.2em; color: var(--ink-3); padding-top: 14px; font-variant-numeric: tabular-nums; }
    .folder-head h2 { margin: 0; font-size: 40px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.05; color: var(--ink); }
    .folder-head p { margin: 10px 0 0; font-size: 14px; color: var(--ink-3); font-weight: 300; }
    .folder-links { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .folder-links a {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 14px 18px;
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      font-size: 16px; font-weight: 400; color: var(--ink-2); transition: color .15s, background .15s;
    }
    .folder-links a:hover { color: var(--ink); background: var(--bg-3); }
    .folder-links a .n {
      font-size: 11px; font-variant-numeric: tabular-nums; min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center;
      border: 1px solid var(--line-2); border-radius: 999px; color: var(--ink);
    }
    .folder-links a .n.ice { border-color: var(--ice); color: var(--ice); }
    .folder-links a .n.amb { border-color: var(--amb); color: var(--amb); }
    .folder-links a .ar { color: var(--ink-3); font-size: 15px; transition: transform .15s; }
    .folder-links a:hover .ar { transform: translateX(3px); color: var(--ink); }

    /* ═══ INSTALL BANNER ═══ */
    .install-banner {
      display: none; position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
      background: rgba(255,255,255,0.96); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--line-2); padding: 12px 14px; z-index: 200; align-items: center; gap: 12px;
    }
    .install-banner.visible { display: flex; }
    .install-banner-icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; }
    .install-banner-text { flex: 1; min-width: 0; }
    .install-banner-title { font-size: 14px; color: var(--ink); }
    .install-banner-desc { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
    .install-banner .btn-install { background: var(--ink); color: var(--bg); border: none; padding: 9px 16px; font: inherit; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
    .install-banner .btn-dismiss { background: none; border: none; color: var(--ink-3); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }

    /* ═══ FOOTER ═══ */
    .dash-footer { padding: 26px 0 48px; display: flex; justify-content: space-between; gap: 16px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); }
    .dash-footer a:hover { color: var(--ink); }

    @media (max-width: 900px) {
      .hero-greeting h1 { font-size: 46px; }
      .folder { grid-template-columns: 44px 1fr; }
      .folder-links { grid-column: 1 / -1; }
      .folder-head h2 { font-size: 32px; }
    }
    @media (max-width: 560px) {
      .wrap, .header-top { padding: 0 18px; }
      .folder .stripe { left: -18px; top: 26px; bottom: 30px; }
      .nav-menu { display: none; }
      .hero-greeting { padding: 48px 0 28px; }
      .hero-greeting h1 { font-size: 38px; }
      .folder { grid-template-columns: 1fr; gap: 16px; padding: 26px 0 30px; }
      .folder-num { padding-top: 0; }
      .folder-head h2 { font-size: 28px; }
      .folder-links { grid-template-columns: 1fr; }
      .folder-links a { min-height: 52px; font-size: 15px; }
      .dash-footer { flex-direction: column; gap: 8px; }
      .wm img { width: 60vw; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="page">

  <!-- Nav -->
  <header class="dash-header">
    <div class="header-top">
      <a class="dash-header-left" href="index.html">
        <img class="dash-header-logo" src="logo-header.png" alt="Northern Wolves Air Conditioning">
        <div class="dash-header-wordmark">Northern Wolves <span>Field</span></div>
      </a>
      <ul class="nav-menu" id="navMenu"></ul>
      <a class="nav-ic" href="support.html" title="AI Support" aria-label="AI Support"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9c0 1.6.4 3.1 1.2 4.4L3 21l4.7-1.2A9 9 0 1 0 12 3z"/><path d="M9 12h.01M12 12h.01M15 12h.01"/></svg></a>
      <div style="position:relative">
        <div class="profile-circle" id="profileCircle" title="Profile" onclick="document.getElementById('profileDropdown').classList.toggle('show')">?</div>
        <div class="profile-dropdown" id="profileDropdown">
          <div class="profile-dd-name" id="profileName">Loading...</div>
          <div class="profile-dd-role" id="profileRole">tech</div>
          <div class="profile-dd-email" id="profileEmail"></div>
          <div class="profile-dd-divider"></div>
          <button class="profile-dd-logout" onclick="logout()">Log Out</button>
        </div>
      </div>
    </div>
    <div class="tline" aria-hidden="true"></div>
  </header>

  <main class="wrap">
    <section class="hero-greeting">
      <h1 id="heroGreeting">Good morning</h1>
      <p id="heroDate"></p>
    </section>

    <!-- My Dispatches -->
    <div class="section-title" id="dispatchSection" style="display:none">
      <h2>My Jobs</h2>
      <a href="dispatch.html">View All &rarr;</a>
    </div>
    <div class="activity-feed" id="dispatchFeed"></div>

    <!-- Folders -->
    <section class="folders" id="folders"></section>

    <footer class="dash-footer">
      <span>Northern Wolves Air Conditioning &mdash; NY &amp; NJ</span>
      <span><a href="support.html">AI Support</a></span>
    </footer>
  </main>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner">
    <img class="install-banner-icon" src="icon-192.png" alt="NW">
    <div class="install-banner-text">
      <div class="install-banner-title">Install Northern Wolves Field</div>
      <div class="install-banner-desc">Quick access from your home screen</div>
    </div>
    <button class="btn-install" id="installBtn">Install</button>
    <button class="btn-dismiss" id="dismissInstall" aria-label="Dismiss">&times;</button>
  </div>

  </div><!-- /.page -->

<script>
(async function() {
  // ===== AUTH GUARD =====
  try { await requireAuth(); } catch(e) { return; }
  await initAuthUI();

  // Close profile dropdown on outside click
  document.addEventListener('click', function(e) {
    var dd = document.getElementById('profileDropdown');
    var circle = document.getElementById('profileCircle');
    if (dd && !dd.contains(e.target) && e.target !== circle) {
      dd.classList.remove('show');
    }
  });
  // ===== CONSTANTS =====
  var DRAFTS_KEY = 'nw_drafts';
  var HISTORY_KEY = 'nw_history';
  var PROFILE_KEY = 'nw_tech_profile';

  // ===== HELPER FUNCTIONS =====

  function getDrafts() {
    try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function getProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null'); }
    catch(e) { return null; }
  }

  function relativeTime(isoString) {
    if (!isoString) return '';
    var now = Date.now();
    var then = new Date(isoString).getTime();
    var diffMs = now - then;
    if (isNaN(diffMs) || diffMs < 0) return '';

    var seconds = Math.floor(diffMs / 1000);
    var minutes = Math.floor(seconds / 60);
    var hours = Math.floor(minutes / 60);
    var days = Math.floor(hours / 24);

    if (seconds < 60) return 'Just now';
    if (minutes < 60) return minutes + 'm ago';
    if (hours < 24) return hours + 'h ago';
    if (days === 1) return 'Yesterday';
    if (days < 7) return days + 'd ago';

    var d = new Date(isoString);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }

  function getReportTypeIcon(type) {
    var icons = {
      'service-call': '\uD83D\uDD27',
      'startup': '\uD83D\uDE80',
      'site-survey': '\uD83D\uDCCB',
      'pm-checklist': '\u2705',
      'work-order': '\uD83D\uDCDD',
      'change-order': '\uD83D\uDCCB',
      'rfi': '\u2753'
    };
    return icons[type] || '\uD83D\uDCCB';
  }

  function getReportTypeLabel(type) {
    var labels = {
      'service-call': 'Service Call',
      'startup': 'Start-Up Report',
      'site-survey': 'Site Survey',
      'pm-checklist': 'Maintenance',
      'work-order': 'Work Order',
      'change-order': 'Change Order',
      'rfi': 'RFI'
    };
    return labels[type] || type || 'Report';
  }

  function getFormPage(type) {
    var pages = {
      'service-call': 'service-call-report.html',
      'startup': 'startup-report.html',
      'site-survey': 'site-survey-report.html',
      'pm-checklist': 'pm-checklist.html',
      'work-order': 'work-order.html',
      'change-order': 'change-order.html',
      'rfi': 'rfi.html'
    };
    return pages[type] || '#';
  }

  function isThisWeek(isoString) {
    if (!isoString) return false;
    var d = new Date(isoString);
    var now = new Date();
    var startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());
    startOfWeek.setHours(0, 0, 0, 0);
    var endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 7);
    return d >= startOfWeek && d < endOfWeek;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ===== HERO GREETING =====
  // Season: May–Sep cooling, Nov–Mar heating, Apr/Oct shoulder. Sets the temperature line + the date suffix.
  var _seasonHtml = '';
  function season() {
    var m = new Date().getMonth() + 1;
    if (m >= 5 && m <= 9) return { key: 'cool', label: 'Cooling season', t1: '55%', t2: '100%', cls: '' };
    if (m >= 11 || m <= 3) return { key: 'heat', label: 'Heating season', t1: '0%', t2: '45%', cls: 'heat' };
    return { key: 'mid', label: 'Shoulder season', t1: '40%', t2: '60%', cls: 'mid' };
  }
  function initSeason() {
    var sn = season();
    document.documentElement.style.setProperty('--t1', sn.t1);
    document.documentElement.style.setProperty('--t2', sn.t2);
    _seasonHtml = ' &nbsp;\u00b7&nbsp; <span class="season ' + sn.cls + '">' + sn.label + '</span>';
    // live outdoor temperature for NYC (Open-Meteo, no key); silently skipped when offline
    fetch('https://api.open-meteo.com/v1/forecast?latitude=40.71&longitude=-74.01&current=temperature_2m&temperature_unit=fahrenheit')
      .then(function(r) { return r.json(); })
      .then(function(j) {
        var t = j && j.current && Math.round(j.current.temperature_2m);
        if (typeof t === 'number' && !isNaN(t)) {
          _seasonHtml = ' &nbsp;\u00b7&nbsp; <span class="season ' + sn.cls + '">' + sn.label + ' <b>\u00b7 ' + t + '\u00b0F</b></span>';
          renderHero();
        }
      }).catch(function() {});
  }

  function renderHero() {
    var hour = new Date().getHours();
    var greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    var profileName = document.getElementById('profileName').textContent || '';
    var firstName = '';
    if (profileName && profileName !== 'Loading...') {
      firstName = profileName.split(' ')[0];
    }
    document.getElementById('heroGreeting').textContent = firstName ? greeting + ', ' + firstName : greeting;

    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var now = new Date();
    document.getElementById('heroDate').innerHTML = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + _seasonHtml;
  }


  // ===== ACTIVITY FEED =====
  function renderActivity() {
    var drafts = getDrafts();
    var history = getHistory();
    var container = document.getElementById('activityFeed');
    if (!container) return;

    var items = [];
    drafts.forEach(function(d) {
      items.push({
        id: d.id,
        type: d.type,
        title: d.title || getReportTypeLabel(d.type),
        customer: d.customer || '',
        time: d.lastModified,
        status: 'draft',
        formPage: d.formPage || getFormPage(d.type)
      });
    });
    history.forEach(function(h) {
      items.push({
        id: h.id,
        type: h.type,
        title: h.title || getReportTypeLabel(h.type),
        customer: h.customer || '',
        time: h.completedAt,
        status: 'completed',
        formPage: null
      });
    });

    items.sort(function(a, b) {
      var tA = a.time ? new Date(a.time).getTime() : 0;
      var tB = b.time ? new Date(b.time).getTime() : 0;
      return tB - tA;
    });

    var recent = items.slice(0, 5);

    if (recent.length === 0) {
      container.innerHTML =
        '<div class="activity-empty">' +
          '<div class="activity-empty-icon">\uD83D\uDCCB</div>' +
          'No reports yet \u2014 tap a form below to get started' +
        '</div>';
      return;
    }

    var html = '';
    recent.forEach(function(item) {
      var href = '';
      if (item.status === 'draft' && item.formPage) {
        href = item.formPage + '?draft=' + encodeURIComponent(item.id);
      } else if (item.status === 'draft') {
        href = getFormPage(item.type) + '?draft=' + encodeURIComponent(item.id);
      } else {
        href = 'history.html';
      }

      var deleteBtn = item.status === 'draft'
        ? '<button class="delete-draft-btn" data-draft-id="' + escapeHtml(item.id) + '" title="Delete draft">&times;</button>'
        : '';

      html +=
        '<div class="activity-item-wrap">' +
        '<a class="activity-item" href="' + escapeHtml(href) + '">' +
          '<div class="activity-icon">' + getReportTypeIcon(item.type) + '</div>' +
          '<div class="activity-info">' +
            '<div class="activity-title">' + escapeHtml(item.title) + '</div>' +
            '<div class="activity-customer">' + escapeHtml(item.customer || getReportTypeLabel(item.type)) + '</div>' +
          '</div>' +
          '<div class="activity-meta">' +
            '<div class="activity-time">' + relativeTime(item.time) + '</div>' +
            '<div class="activity-badge ' + item.status + '">' + item.status + '</div>' +
          '</div>' +
        '</a>' +
        deleteBtn +
        '</div>';
    });

    container.innerHTML = html;

    // Attach delete handlers
    container.querySelectorAll('.delete-draft-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var draftId = btn.getAttribute('data-draft-id');
        if (confirm('Delete this draft?')) {
          deleteDraft(draftId);
          renderStats();
          renderActivity();
        }
      });
    });
  }

  function deleteDraft(draftId) {
    var drafts = getDrafts();
    var filtered = drafts.filter(function(d) { return d.id !== draftId; });
    localStorage.setItem(DRAFTS_KEY, JSON.stringify(filtered));
    // Also remove saved form data
    localStorage.removeItem('nw_draft_' + draftId);
  }

  // ===== FOLDERS + NAV =====
  // Four folders. Each link: [title, href, draftType?, managementOnly?]
  var FOLDERS = [
    { num: '01', title: 'Projects', desc: 'Docs, drawings, contracts, billing', stripe: '', links: [
      ['All Projects', 'projects.html'],
      ['Bid Board', 'bid-board.html', null, true],
      ['Prime Contracts', 'invoicing.html', null, true],
      ['Change Orders', 'change-order.html', 'change-order']
    ]},
    { num: '02', title: 'Reports', desc: 'Field reports from the job', stripe: 'var(--ice)', links: [
      ['Service Call', 'history.html?type=service-call', 'service-call', false, 'ice'],
      ['Start-Up', 'history.html?type=startup', 'startup', false, 'amb'],
      ['Site Survey', 'history.html?type=site-survey', 'site-survey'],
      ['Maintenance', 'history.html?type=pm-checklist', 'pm-checklist'],
      ['Work Order', 'history.html?type=work-order', 'work-order']
    ]},
    { num: '03', title: 'Tools', desc: 'Crews, materials, deliveries', stripe: 'var(--amb)', links: [
      ['Schedule', 'schedule.html'],
      ['Field Orders', 'field-orders.html'],
      ['Delivery Schedule', 'driver-schedule.html'],
      ['Dispatch', 'dispatch.html']
    ]},
    { num: '04', title: 'Office', desc: 'Customers, planning, oversight', stripe: '', links: [
      ['Customers', 'customers.html'],
      ['Equipment', 'equipment.html'],
      ['Workload Planner', 'workload.html', null, true],
      ['Management', 'management.html', null, true],
      ['Activity', 'history.html'],
      ['AI Support', 'support.html']
    ]}
  ];

  function renderReportGrid(isTech) {
    var drafts = getDrafts();
    var draftCounts = {};
    drafts.forEach(function(d) { if (d.type) draftCounts[d.type] = (draftCounts[d.type] || 0) + 1; });

    var page = '', nav = '';
    FOLDERS.forEach(function(f) {
      var links = f.links.filter(function(l) { return !(isTech && l[3]); });
      var cells = '', dd = '';
      links.forEach(function(l) {
        var count = l[2] ? (draftCounts[l[2]] || 0) : 0;
        var tail = count > 0 ? '<span class="n ' + (l[4] || '') + '">' + count + '</span>' : '<span class="ar">\u2192</span>';
        cells += '<a href="' + l[1] + '" data-page="' + l[1].split('?')[0] + '"><span>' + l[0] + '</span>' + tail + '</a>';
        dd += '<a href="' + l[1] + '">' + l[0] + '</a>';
      });
      page +=
        '<section class="folder">' +
          (f.stripe ? '<i class="stripe" style="background:' + f.stripe + '"></i>' : '') +
          '<div class="folder-num">' + f.num + '</div>' +
          '<div class="folder-head"><h2>' + f.title + '</h2><p>' + f.desc + '</p></div>' +
          '<div class="folder-links">' + cells + '</div>' +
        '</section>';
      nav += '<li><a href="' + links[0][1] + '">' + f.title + '</a><div class="nav-dd"><small>' + f.title + '</small>' + dd + '</div></li>';
    });
    document.getElementById('folders').innerHTML = page;
    document.getElementById('navMenu').innerHTML = nav;
  }

  // ===== PROFILE (handled by auth.js) =====

  // ===== INSTALL PROMPT =====
  var deferredPrompt = null;
  var installBanner = document.getElementById('installBanner');
  var installBtn = document.getElementById('installBtn');
  var dismissBtn = document.getElementById('dismissInstall');

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('nw_install_dismissed')) {
      installBanner.classList.add('visible');
    }
  });

  installBtn.addEventListener('click', function() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(result) {
        deferredPrompt = null;
        installBanner.classList.remove('visible');
      });
    }
  });

  dismissBtn.addEventListener('click', function() {
    installBanner.classList.remove('visible');
    localStorage.setItem('nw_install_dismissed', '1');
  });

  // iOS install detection
  function checkiOSInstall() {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isStandalone = window.navigator.standalone === true;
    if (isIOS && !isStandalone && !deferredPrompt && !localStorage.getItem('nw_install_dismissed')) {
      var banner = document.getElementById('installBanner');
      var btn = document.getElementById('installBtn');
      btn.textContent = 'How to Install';
      btn.addEventListener('click', function iosHandler() {
        btn.removeEventListener('click', iosHandler);
        alert('To install: tap the Share button in Safari, then tap "Add to Home Screen".');
        banner.classList.remove('visible');
        localStorage.setItem('nw_install_dismissed', '1');
      }, { once: true });
      banner.classList.add('visible');
    }
  }

  // ===== DISPATCH INBOX =====
  async function renderDispatches() {
    if (typeof getDispatches !== 'function' || typeof getCurrentUser !== 'function') return;
    try {
      var userRes = await getCurrentUser();
      if (!userRes.data) return;
      var res = await getDispatches({ assigned_to: userRes.data.id, not_status: 'completed', limit: 5 });
      var jobs = (res.data || []).filter(function(d) { return d.status !== 'cancelled'; });
      if (jobs.length === 0) return;

      document.getElementById('dispatchSection').style.display = 'flex';
      var container = document.getElementById('dispatchFeed');
      var priorityIcons = { critical: '\uD83D\uDD34', high: '\uD83D\uDFE0', standard: '\uD83D\uDD35', low: '\u26AA' };
      var html = '';
      jobs.forEach(function(d) {
        html += '<a class="activity-item" href="dispatch.html">' +
          '<div class="activity-icon">' + (priorityIcons[d.priority] || '\uD83D\uDD35') + '</div>' +
          '<div class="activity-info">' +
            '<div class="activity-title">' + escapeHtml(d.title) + '</div>' +
            '<div class="activity-customer">' + escapeHtml(d.customer_name || d.address || 'No location') + '</div>' +
          '</div>' +
          '<div class="activity-meta">' +
            (d.scheduled_date ? '<div class="activity-time">' + d.scheduled_date.substring(5).replace('-','/') + '</div>' : '') +
            '<div class="activity-badge ' + (d.status === 'pending' ? 'draft' : 'completed') + '">' + (d.status || 'pending') + '</div>' +
          '</div>' +
        '</a>';
      });
      container.innerHTML = html;
    } catch(e) {
      console.error('[dashboard] dispatch load error:', e);
    }
  }

  // ===== INIT =====
  initSeason();
  renderHero();
  renderReportGrid(false);
  renderDispatches();

  // Techs do not see management-only links (Bid Board, Prime Contracts, Workload, Management)
  getAuthProfile().then(function(profile) {
    if (profile && profile.role === 'tech') renderReportGrid(true);
    var pc = document.getElementById('profileCircle');
    if (pc && profile) pc.classList.add(profile.role === 'tech' ? 'tech' : 'mgmt');
  }).catch(function(){});

  // Update hero once profile loads (auth.js sets profileName async)
  var heroObserver = new MutationObserver(function() { renderHero(); });
  var pnEl = document.getElementById('profileName');
  if (pnEl) heroObserver.observe(pnEl, { childList: true, characterData: true, subtree: true });

  // Delayed iOS check (wait for beforeinstallprompt to potentially fire)
  setTimeout(checkiOSInstall, 1000);
})();
</script>

</body>
