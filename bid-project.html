<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="procore-ui.css?v=344">

<script src="supabase-config.js?v=344"></script>
<script src="auth.js?v=344"></script>
<script src="est-totals.js?v=344"></script>
<script src="procore-ui.js?v=344"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
  /* NW logo header is mounted by PC.mountHeader(); its styles live in procore-ui.css (.pc-page .dash-header …) */
  :root { --nav-h: 60px; }

  /* ── page shell ── */
  body.pc-page { background: var(--pc-bg, #f5f6f7); }
  .bp-head { background: #fff; border-bottom: 1px solid var(--pc-border, #e5e7eb); }
  .bp-head .pc-title-row { border-bottom: 0; }
  .bp-head .pc-crumb { padding: 10px 24px 0; }
  .bp-head .pc-title-row { padding-left: 24px; padding-right: 24px; }
  .bp-main { padding: 16px 24px 24px; }
  .bp-main.frame-mode { padding: 0; }
  .bp-pane[hidden] { display: none !important; }
  .bp-frame { display: block; width: 100%; border: 0; background: #fff; min-height: 480px; }
  #schemaBanner { margin: 12px 24px 0; display: none; }
  #schemaBanner.show { display: block; }
  body.bp-strip-hidden .pc-est-strip { display: none !important; }
  body.bp-strip-hidden.has-est-strip { padding-bottom: 0; }
  /* frame tabs: the iframe is sized to end above the fixed strip, so the body needs no strip padding */
  body.bp-frame-mode.has-est-strip { padding-bottom: 0; }

  /* ── Takeoff / Estimating: the whole shell collapses to ONE compact bar so the work area gets the screen ── */
  .bp-fs-left, .bp-fs-right { display: none; }
  body.bp-frame-mode .dash-header { display: none !important; }
  body.bp-frame-mode .bp-head { display: flex; align-items: stretch; flex-wrap: nowrap; min-height: 46px; padding: 0 8px 0 0; overflow: hidden; }
  body.bp-frame-mode .bp-head #titleHost, body.bp-frame-mode .bp-head #titleHost .pc-wrap, body.bp-frame-mode .bp-head #titleHost .pc-title-row { display: contents; }
  body.bp-frame-mode .bp-head .pc-crumb { display: none; }
  body.bp-frame-mode .bp-fs-left { order: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px; border-right: 1px solid var(--pc-border, #e5e7eb); margin-right: 14px; }
  body.bp-frame-mode .bp-fs-home img { height: 30px; width: auto; display: block; }
  body.bp-frame-mode .bp-fs-back { font-size: 12px; color: var(--pc-link, #1a66e0); text-decoration: none; white-space: nowrap; }
  body.bp-frame-mode .bp-fs-back:hover { text-decoration: underline; }
  body.bp-frame-mode #titleHost .pc-title-row > div:not(.pc-title-actions) { order: 1; display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; max-width: 34vw; margin-right: 10px; }
  body.bp-frame-mode #pcTitle { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.bp-frame-mode #pcTitleSub { display: inline !important; font-size: 11px; color: var(--pc-muted, #6b7280); white-space: nowrap; margin: 0; }
  body.bp-frame-mode #pcStageSlot { order: 2; display: flex; align-items: center; margin-right: 10px; }
  body.bp-frame-mode #tabsHost { order: 3; flex: 1 1 auto; display: flex; align-items: stretch; padding: 0; border-bottom: 0; min-width: 0; overflow: hidden; }
  body.bp-frame-mode #tabsHost .pc-tab { display: flex; align-items: center; padding: 0 14px; }
  body.bp-frame-mode .pc-title-actions { order: 4; margin: 0 6px; display: flex; align-items: center; gap: 8px; width: auto; }
  body.bp-frame-mode .bp-fs-right { order: 5; display: flex; align-items: center; }

  /* ── overview ── */
  .bp-2col { display: grid; grid-template-columns: 1fr 420px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .bp-2col { grid-template-columns: 1fr; } }
  .bp-card-title { font-size: 15px; font-weight: 600; padding: 16px 16px 8px; display: flex; align-items: center; gap: 8px; }
  .bp-card-title .spacer { flex: 1; }
  .bp-total-chip { font-size: 12px; font-weight: 600; color: var(--pc-link, #1a66e0); background: var(--pc-link-bg, #e8f0fe); padding: 3px 10px; border-radius: 12px; }
  .bp-form { padding: 4px 16px 16px; }
  .bp-form .pc-label { color: var(--pc-text, #1f2933); font-weight: 500; }
  .bp-form textarea.pc-textarea { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; }
  .bp-form .pc-input[disabled], .bp-form .pc-select[disabled], .bp-form .pc-textarea[disabled] { background: #f9fafb; color: var(--pc-muted, #6b7280); }
  .bp-icon-field { position: relative; }
  .bp-icon-field .pc-input { padding-right: 34px; }
  .bp-icon-field > svg, .bp-icon-field > .ic { position: absolute; right: 10px; top: 9px; color: var(--pc-muted, #6b7280); pointer-events: none; }
  .bp-icon-field.left .pc-select { padding-left: 34px; }
  .bp-icon-field.left > .ic { left: 10px; right: auto; }
  .bp-icon-field.left > .ic.locked { color: var(--pc-danger, #dc2626); }
  .bp-icon-field.left > .ic.unlocked { color: var(--pc-success, #16a34a); }
  .bp-estimator { position: relative; }
  .bp-estimator .pc-select { padding-right: 60px; }
  .bp-estimator .clear { position: absolute; right: 30px; top: 6px; width: 24px; height: 24px; border: 0; background: transparent; cursor: pointer; color: var(--pc-muted, #6b7280); padding: 0; display: grid; place-items: center; }
  .bp-estimator .clear:hover { color: var(--pc-text, #1f2933); }
  .bp-inv-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--pc-muted, #6b7280); cursor: pointer; padding: 6px 0; user-select: none; }
  .bp-inv-toggle svg { transition: transform .15s; }
  .bp-inv-toggle.open svg { transform: rotate(180deg); }
  #invBody[hidden] { display: none; }
  .bp-cust-label { font-size: 12px; color: var(--pc-muted, #6b7280); margin: 0 0 6px; }
  .bp-add-btn { width: 100%; height: 36px; border: 0; border-radius: 4px; background: var(--pc-secondary, #f0f1f3); color: var(--pc-text, #1f2933); font: inherit; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .bp-add-btn:hover { background: #e5e7eb; }
  .bp-add-btn[disabled] { opacity: .5; cursor: default; }
  .bp-cust-block { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--pc-border, #e5e7eb); border-radius: 4px; background: #fff; }
  .bp-cust-block .txt { flex: 1; line-height: 1.4; }
  .bp-cust-block .txt b { display: block; }
  .bp-cust-block .txt .sub { color: var(--pc-muted, #6b7280); font-size: 12px; }
  .bp-cust-block .pc-btn-icon { flex: none; }

  /* side panels */
  .bp-side-card + .bp-side-card { margin-top: 16px; }
  .bp-side-h { display: flex; align-items: center; padding: 14px 16px; font-size: 15px; font-weight: 600; }
  .bp-side-h .spacer { flex: 1; }
  .bp-side-b { padding: 0 16px 16px; }
  .bp-empty { text-align: center; padding: 36px 12px 28px; color: var(--pc-muted, #6b7280); font-size: 13px; }
  .bp-empty .art { width: 72px; height: 54px; margin: 0 auto 14px; border: 2px solid #1a66e0; border-radius: 3px; position: relative; background: #fff; }
  .bp-empty .art::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: #1a66e0; }
  .bp-empty .art::after { content: '+'; position: absolute; left: -12px; bottom: -10px; width: 24px; height: 24px; border-radius: 50%; background: #f47e42; color: #fff; font-weight: 700; line-height: 24px; text-align: center; font-size: 16px; }
  .bp-empty b { display: block; color: var(--pc-text, #1f2933); font-size: 14px; margin-bottom: 4px; }
  .bp-composer { border: 1px solid var(--pc-border-strong, #d1d5db); border-radius: 4px; padding: 8px; margin-bottom: 10px; background: #fff; }
  .bp-composer textarea { width: 100%; min-height: 70px; border: 0; outline: 0; resize: vertical; font: inherit; padding: 4px; }
  .bp-composer .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  .bp-note { padding: 10px 0; border-top: 1px solid var(--pc-row-sep, #eceff3); display: flex; gap: 10px; }
  .bp-note:first-child { border-top: 0; }
  .bp-note .txt { flex: 1; min-width: 0; }
  .bp-note .meta { font-size: 12px; color: var(--pc-muted, #6b7280); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .bp-note .body { white-space: pre-wrap; word-break: break-word; }
  .bp-task { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--pc-row-sep, #eceff3); }
  .bp-task:first-child { border-top: 0; }
  .bp-task input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--pc-link, #1a66e0); }
  .bp-task .txt { flex: 1; min-width: 0; }
  .bp-task.done .txt .t { text-decoration: line-through; color: var(--pc-muted, #6b7280); }
  .bp-task .sub { font-size: 12px; color: var(--pc-muted, #6b7280); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bp-task .sub .past { color: var(--pc-danger, #dc2626); font-weight: 600; }
  .bp-task .sub .soon { color: var(--pc-amber, #b45309); font-weight: 600; }

  /* ── documents ── */
  .bp-docs { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; min-height: 60vh; }
  @media (max-width: 900px) { .bp-docs { grid-template-columns: 1fr; } }
  .bp-tree-row { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; cursor: pointer; border-left: 3px solid transparent; font-size: 13px; }
  .bp-tree-row:hover { background: var(--pc-row-active, #f3f6fb); }
  .bp-tree-row.sel { border-left-color: var(--pc-link, #1a66e0); background: var(--pc-row-active, #f3f6fb); }
  .bp-tree-row.sub { padding-left: 34px; }
  .bp-tree-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bp-tree-row .cnt { color: var(--pc-muted, #6b7280); font-size: 12px; }
  .bp-tree-row .ic { color: var(--pc-muted, #6b7280); display: inline-flex; }
  .bp-doc-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--pc-border, #e5e7eb); color: var(--pc-muted, #6b7280); font-size: 13px; }
  .bp-doc-head .spacer { flex: 1; }
  .bp-doc-head input[type=range] { width: 120px; accent-color: var(--pc-text, #1f2933); }
  .bp-doc-tools { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--pc-border, #e5e7eb); }
  .bp-doc-tools .pc-select { width: 140px; height: 32px; }
  .bp-doc-tools .spacer { flex: 1; }
  .bp-doc-tools .pc-search { width: 260px; }
  .bp-doc-tools .pc-search input { height: 32px; }
  .bp-doc-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--pc-row-sep, #eceff3); font-size: 13px; }
  .bp-doc-row:hover { background: var(--pc-row-active, #f3f6fb); }
  .bp-doc-row .ic { color: var(--pc-muted, #6b7280); display: inline-flex; }
  .bp-doc-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .bp-doc-row .sub { color: var(--pc-muted, #6b7280); font-size: 12px; }
  .bp-doc-grid { display: flex; flex-wrap: wrap; gap: 14px; padding: 16px; }
  .bp-page-tile { border: 1px solid var(--pc-border, #e5e7eb); border-radius: 4px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
  .bp-page-tile .th { background: #f3f4f6; display: grid; place-items: center; min-height: 60px; cursor: pointer; }
  .bp-page-tile .th img { display: block; width: 100%; height: auto; }
  .bp-page-tile .cap { display: flex; align-items: center; gap: 4px; padding: 6px 4px 6px 8px; font-size: 12px; border-top: 1px solid var(--pc-border, #e5e7eb); }
  .bp-page-tile .cap .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .bp-page-tile .cap .sc { color: var(--pc-muted, #6b7280); font-size: 11px; }

  /* ── proposal ── */
  .bp-prop { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .bp-prop { grid-template-columns: 1fr; } }
  .bp-prop-settings { position: sticky; top: calc(var(--nav-h, 60px) + 12px); max-height: calc(100vh - var(--nav-h, 60px) - 80px); overflow: auto; }
  .bp-prop-settings .pc-card-b { padding: 8px 16px 16px; }
  .bp-ps-sec { font-size: 12px; color: var(--pc-muted, #6b7280); margin: 14px 0 6px; }
  .bp-ps-sec:first-child { margin-top: 4px; }
  .bp-ps-sub { font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  .bp-switch { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; font-size: 13px; user-select: none; }
  .bp-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .bp-switch i { width: 34px; height: 18px; border-radius: 9px; background: #9ca3af; position: relative; flex: none; transition: background .15s; }
  .bp-switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .bp-switch input:checked + i { background: var(--pc-link, #1a66e0); }
  .bp-switch input:checked + i::after { left: 18px; }
  .bp-switch.off { opacity: .5; cursor: default; }
  .bp-prop-settings .pc-select { height: 32px; }
  .bp-prop-settings .pc-field { margin-bottom: 8px; }
  .bp-prop-settings .bp-add-btn { height: 32px; margin-top: 4px; font-size: 13px; }
  .bp-prop-settings .bp-cust-mini { font-size: 12px; color: var(--pc-muted, #6b7280); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .bp-prop-settings .bp-cust-mini b { color: var(--pc-text, #1f2933); }
  .bp-prop-centre { min-width: 0; }
  .bp-prop-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; min-height: 32px; }
  .bp-prop-bar .spacer { flex: 1; }
  .bp-prop-bar .mode { font-size: 12px; color: var(--pc-muted, #6b7280); }
  .bp-prop-bar .mode.on { color: var(--pc-amber, #b45309); font-weight: 600; }
  #propToolbar { display: none; flex-wrap: wrap; gap: 4px; align-items: center; }
  #propToolbar.show { display: flex; }
  .prop-btn { height: 28px; min-width: 30px; padding: 0 8px; background: #fff; border: 1px solid var(--pc-border-strong, #d1d5db); border-radius: 4px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--pc-text, #1f2933); }
  .prop-btn:hover { background: var(--pc-secondary, #f0f1f3); }
  .bp-paper { background: #fff; max-width: 960px; margin: 0 auto; padding: 40px 48px; border: 1px solid var(--pc-border, #e5e7eb); box-shadow: 0 2px 10px rgba(0,0,0,.06); min-height: 70vh; font-size: 13px; line-height: 1.5; color: #1f2933; outline: none; }
  .bp-paper[contenteditable=true] { box-shadow: 0 0 0 2px var(--pc-link, #1a66e0); }
  .bp-paper table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 12px; }
  .bp-paper th { text-align: right; padding: 6px 8px; font-weight: 400; color: #6b7280; border-bottom: 1px solid #d1d5db; }
  .bp-paper th:first-child { text-align: left; }
  .bp-paper td { padding: 5px 8px; border-bottom: 1px solid #eceff3; text-align: right; }
  .bp-paper td:first-child { text-align: left; }
  .bp-paper h2 { font-size: 15px; margin: 16px 0 6px; }
  .bp-paper h3 { font-size: 13px; margin: 14px 0 6px; }
  .bp-paper p { margin: 0 0 8px; }
  .bp-paper ul, .bp-paper ol { padding-left: 24px; margin: 6px 0 12px; }
</style>
</head>
<body class="pc-page">

<div class="bp-head">
  <div class="bp-fs-left"><a href="index.html" class="bp-fs-home" title="Home"><img src="logo-header.png" alt="Northern Wolves AC"></a><a href="bid-board.html" class="bp-fs-back" title="Back to the Bid Board">&#8249; Bid Board</a></div>
  <div id="titleHost"></div>
  <div id="tabsHost"></div>
  <div class="bp-fs-right"><button type="button" class="pc-btn pc-btn-ghost pc-btn-icon" id="fsBtn" title="Full screen"></button></div>
</div>

<div id="schemaBanner" class="pc-banner-info"></div>

<main class="bp-main" id="bpMain">

  <!-- ═══════ OVERVIEW ═══════ -->
  <div class="bp-pane" id="body-overview">
    <div class="bp-2col">
      <div>
        <div class="pc-card">
          <div class="bp-card-title"><span>Estimate Overview</span><span class="spacer"></span><span class="bp-total-chip" id="ovTotalChip" title="Estimate Total (current version)">Estimate Total —</span></div>
          <div class="bp-form">
            <div class="pc-grid2">
              <div class="pc-field"><label class="pc-label" for="ovName">Estimate Name</label><input class="pc-input" type="text" id="ovName" data-col="name"></div>
              <div class="pc-field"><label class="pc-label" for="ovNumber">Project Number</label><input class="pc-input" type="text" id="ovNumber" data-col="project_number"></div>
            </div>
            <div class="pc-field"><label class="pc-label" for="ovDescription">Project Description</label><textarea class="pc-textarea" id="ovDescription" data-col="project_description"></textarea></div>
            <div class="pc-grid2">
              <div class="pc-field"><label class="pc-label" for="ovEstimator">Estimator</label>
                <div class="bp-estimator"><select class="pc-select" id="ovEstimator" data-col="estimator_name"><option value="">— Select —</option></select><button type="button" class="clear" id="ovEstimatorClear" title="Clear estimator"></button></div>
              </div>
              <div class="pc-field"><label class="pc-label" for="ovOffice">Office</label>
                <select class="pc-select" id="ovOffice" data-col="office">
                  <option value="">— Select —</option>
                  <option>NYC</option>
                  <option>Long Island</option>
                  <option>NJ</option>
                  <option>Westchester</option>
                  <option>Other</option>
                </select>
              </div>
            </div>
            <div class="pc-grid2">
              <div class="pc-field"><label class="pc-label" for="ovMeasure">Measurement System</label>
                <select class="pc-select" id="ovMeasure"><option value="US">US</option><option value="Metric">Metric</option></select>
              </div>
              <div class="pc-field"><label class="pc-label" for="ovSqft">Square Footage</label><input class="pc-input" type="number" step="1" min="0" id="ovSqft" data-col="square_footage"></div>
            </div>
            <div class="pc-grid2">
              <div class="pc-field"><label class="pc-label" for="ovDue">Due Date</label><div class="bp-icon-field" id="ovDueWrap"><input class="pc-input" type="date" id="ovDue" data-col="bid_due_date"></div></div>
              <div class="pc-field"><label class="pc-label" for="ovDueTime">Due Time</label><div class="bp-icon-field" id="ovDueTimeWrap"><input class="pc-input" type="time" id="ovDueTime" data-col="due_time"></div></div>
            </div>
            <div class="pc-field"><label class="pc-label" for="ovPricing">Estimate pricing</label>
              <div class="bp-icon-field left" id="ovPricingWrap"><select class="pc-select" id="ovPricing"><option value="unlocked">Unlocked</option><option value="locked">Locked</option></select></div>
            </div>
            <div class="bp-inv-toggle" id="invToggle">Invitation</div>
            <div id="invBody" hidden>
              <div class="pc-grid2">
                <div class="pc-field"><label class="pc-label" for="ovGc">Requester Company</label><input class="pc-input" type="text" id="ovGc" data-col="requester_company" placeholder="General contractor"></div>
                <div class="pc-field"><label class="pc-label" for="ovGcEmail">Requester Email</label><input class="pc-input" type="email" id="ovGcEmail" data-col="requester_email"></div>
              </div>
              <div class="pc-grid2">
                <div class="pc-field"><label class="pc-label" for="ovInviteDate">Invitation Date</label><input class="pc-input" type="date" id="ovInviteDate" data-col="invitation_date"></div>
                <div class="pc-field"><label class="pc-label" for="ovIntent">Bid Intent</label>
                  <select class="pc-select" id="ovIntent" data-col="bid_intent"><option value="">—</option><option value="undecided">Undecided</option><option value="will_bid">Will Bid</option><option value="no_bid">No Bid</option></select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="pc-card" style="margin-top:16px">

<script>
requireAuth().catch(function(){});
(function() {
  'use strict';

  if (!window.PC) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="margin:24px;padding:14px;background:#fee2e2;color:#991b1b;border-radius:4px;font:14px sans-serif">procore-ui.js did not load — the Bid Project page needs the shared Procore UI layer.</div>');
    return;
  }

  var TABS = ['overview','documents','takeoff','estimating','proposal'];
  var params = new URLSearchParams(location.search);
  var paramId = params.get('id');
  var paramEst = params.get('est');
  if (!paramId) { location.href = 'bid-board.html'; return; }

  var currentUser = null, profile = null, canEdit = false;
  var currentEstimate = null;   // root row (project)
  var currentVersion = null;    // estimate version shown on takeoff / estimating / proposal
  var currentTab = (location.hash || '#overview').replace('#', '');
  if (TABS.indexOf(currentTab) < 0) currentTab = 'overview';
  var profilesCache = null;
  var linesCache = null;        // estimate_line_items of currentVersion
  var frames = { takeoff: null, estimating: null };
  var frameReady = { takeoff: false, estimating: false };
  var pendingCmds = { takeoff: [], estimating: [] };
  var schemaMissing = false;

  function rootId() { return currentEstimate ? currentEstimate.id : paramId; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function toast(m, k) { PC.toast(m, k || 'info'); }
  function icon(n, s) { return PC.icon(n, s || 18); }
  function debounce(fn, ms) { var t; return function() { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function() { fn.apply(c, a); }, ms); }; }
  function settingsOf(row) { return (row && row.settings && typeof row.settings === 'object') ? row.settings : {}; }
  function viewOnly() { toast('View only — management or estimator role needed', 'error'); }
  function money(n) { return PC.money(Number(n) || 0); }

  // ═══════════════════════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════════════════════
  init();

  async function init() {
    if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    PC.mountHeader();   // idempotent: inserts the NW header first in <body>, runs initAuthUI(), installs the outside-click closer

    try {
      var u = await supabaseClient.auth.getUser();
      if (u && u.data && u.data.user) currentUser = u.data.user;
      profile = (typeof getAuthProfile === 'function') ? await getAuthProfile() : null;
      if (!profile && currentUser) {
        var prof = await supabaseClient.from('profiles').select('id,role,full_name,email').eq('id', currentUser.id).maybeSingle();
        profile = prof.data;
      }
      canEdit = PC.canEdit(profile || {});
    } catch(e) { console.warn(e); }

    var ok = await loadEstimate();
    if (!ok) return;

    bindOverview();
    bindDocuments();
    bindProposal();
    window.addEventListener('message', onFrameMessage);
    window.addEventListener('hashchange', function() {
      var t = (location.hash || '#overview').replace('#', '');
      if (TABS.indexOf(t) >= 0 && t !== currentTab) setTab(t, true);
    });
    window.addEventListener('resize', sizeFrames);
    // Full screen button (browser Fullscreen API) — the compact bar itself is automatic on the Takeoff / Estimating tabs
    (function() {
      var b = $('fsBtn'); if (!b) return;
      function paint() { var on = !!document.fullscreenElement; b.innerHTML = PC.icon(on ? 'fullscreen_exit' : 'fullscreen', 20); b.title = on ? 'Exit full screen (Esc)' : 'Full screen'; }
      b.addEventListener('click', function() {
        if (document.fullscreenElement) { document.exitFullscreen(); return; }
        var pr; try { pr = document.documentElement.requestFullscreen(); } catch (e) { pr = Promise.reject(e); }
        if (pr && pr.catch) pr.catch(function() { if (typeof toast === 'function') toast('Full screen was blocked by the browser — press F11 instead', 'error'); });
      });
      document.addEventListener('fullscreenchange', function() { paint(); setTimeout(sizeFrames, 60); });
      paint();
      try { new ResizeObserver(function() { sizeFrames(); }).observe(document.querySelector('.bp-head')); } catch (e) {}
    })();
    window.addEventListener('beforeunload', function(e) {
      if (propDirty) { e.preventDefault(); e.returnValue = ''; }
    });

    hydrateOverview();
    loadNotesTasks();
    renderStrip();
    setTab(currentTab, true);
  }

  async function loadEstimate() {
    var r = await supabaseClient.from('estimates').select('*').eq('id', paramId).maybeSingle();
    if (r.error || !r.data) { toast('Estimate not found', 'error'); setTimeout(function() { location.href = 'bid-board.html'; }, 1200); return false; }
    var row = r.data;
    if (row.parent_estimate_id) {
      // ?id pointed at an alternate → normalise to ?id=root&est=alternate
      var rr = await supabaseClient.from('estimates').select('*').eq('id', row.parent_estimate_id).maybeSingle();
      if (rr.data) {
        currentEstimate = rr.data;
        currentVersion = row;
        if (!paramEst) paramEst = row.id;
        paramId = currentEstimate.id;
      } else {
        currentEstimate = row; currentVersion = row;
      }
    } else {
      currentEstimate = row;
      currentVersion = row;
      if (paramEst && paramEst !== row.id) {
        var vr = await supabaseClient.from('estimates').select('*').eq('id', paramEst).maybeSingle();
        if (vr.data && (vr.data.parent_estimate_id === row.id || vr.data.id === row.id)) currentVersion = vr.data;
        else paramEst = null;
      }
    }
    if (!('settings' in currentEstimate)) showSchemaBanner();
    syncUrl();
    document.title = (currentVersion.quote_number ? 'Q' + currentVersion.quote_number + ' · ' : '') + (currentVersion.name || 'Bid Project') + ' — NWAC';
    return true;
  }

  // push = user-initiated tab click → new history entry (Back returns to the previous tab, like Procore's per-tab URLs);
  // otherwise (init / hashchange / version switch) replace the current entry.
  function syncUrl(push) {
    var url = 'bid-project.html?id=' + rootId() + (currentVersion && currentVersion.id !== rootId() ? '&est=' + currentVersion.id : '') + '#' + currentTab;
    try { if (push) history.pushState(null, '', url); else history.replaceState(null, '', url); } catch(e) {}
  }

  function showSchemaBanner() {
    schemaMissing = true;
    var b = $('schemaBanner');
    b.textContent = 'Procore-style settings (measurement system, pricing lock, proposal detail settings) are not saved yet — run procore-ui-schema.sql on Supabase to add estimates.settings.';
    b.classList.add('show');
  }

  // ═══════════════════════════════════════════════════════════════
  //  TITLE ROW / TABS / SHELL
  // ═══════════════════════════════════════════════════════════════
  function renderTitle() {
    var e = currentVersion || currentEstimate;
    var stage = currentEstimate.bid_stage || 'estimating';
    PC.renderTitleRow($('titleHost'), {
      crumb: { label: 'Bid Board', href: 'bid-board.html' },
      title: e.name || '(untitled)',
      sub: e.quote_number ? 'Q#' + e.quote_number : '',
      stage: { value: stage, onChange: updateStage, readOnly: !canEdit },
      avatarName: e.estimator_name || '',
      actions: tabActions(currentTab),
      kebab: projectMenu()
    });
  }

  function tabActions(tab) {
    if (tab === 'overview') return [ { id: 'upload', label: 'Upload', primary: true, onClick: openUploadDrawings } ];
    if (tab === 'documents') return [
      { id: 'autoRename', label: 'Auto-rename', icon: 'auto_awesome', onClick: autoRenameDrawings },
      { id: 'startTakeoff', label: 'Start Takeoff', onClick: function() { setTab('takeoff'); } },
      { id: 'upload', label: 'Upload', primary: true, onClick: openUploadDrawings }
    ];
    if (tab === 'takeoff') return [
      { id: 'showEstimate', label: 'Show Estimate', onClick: function() { sendCmd('takeoff', 'showEstimate'); } },
      { id: 'newLayer', label: 'Create New Takeoff Layer', primary: true, onClick: function() { if (!canEdit) return viewOnly(); sendCmd('takeoff', 'newLayer'); } }
    ];
    // Estimating: plain buttons — the embedded estimating.html owns the single Actions / Import / Export menu
    // (handleCmd opens PC.menu on its grid bar), so the header must not render a second copy of it.
    if (tab === 'estimating') return [
      { id: 'actions', label: 'Actions', primary: true, icon: 'expand_more', title: 'Actions', onClick: function() { sendCmd('estimating', 'actions'); } },
      { id: 'import', label: 'Import', icon: 'expand_more', title: 'Import estimate / BoM', onClick: function() { sendCmd('estimating', 'import'); } },
      { id: 'export', label: 'Export', icon: 'expand_more', title: 'Export estimate / BoM', onClick: function() { sendCmd('estimating', 'export'); } }
    ];
    if (tab === 'proposal') return [
      { id: 'export', label: 'Export', primary: true, menu: [
        { label: 'PDF', icon: 'description', onClick: exportProposalPdf },
        { label: 'NWAC letter (PDF)', icon: 'description', onClick: exportProposalLetter },
        { label: 'Excel (line items)', icon: 'grid_on', onClick: exportProposalXlsx }
      ] }
    ];
    return [];
  }

  function projectMenu() {
    var archived = (currentEstimate.bid_stage === 'archived');
    return [
      { label: 'Copy Project', icon: 'content_copy', disabled: !canEdit, onClick: copyProject },
      { label: 'Copy Project to Template', icon: 'content_copy', disabled: !canEdit, onClick: copyToTemplate },
      { label: 'Set Project as Template', icon: 'check', disabled: !canEdit, onClick: setAsTemplate },
      { label: 'Set Project as Default Template', icon: 'check_circle', disabled: !canEdit, onClick: setAsDefaultTemplate },
      { label: 'Apply Project Template', icon: 'content_paste', disabled: !canEdit, onClick: applyTemplateDialog },
      { sep: true },
      archived
        ? { label: 'Unarchive', icon: 'undo', disabled: !canEdit, onClick: unarchiveProject }
        : { label: 'Archive', icon: 'folder', disabled: !canEdit, onClick: archiveProject },
      { label: 'Delete', icon: 'delete', danger: true, disabled: !canEdit, onClick: deleteProject }
    ];
  }

  function renderTabs() {
    PC.renderTabs($('tabsHost'), {
      active: currentTab,
      hrefs: { overview: '#overview', documents: '#documents', takeoff: '#takeoff', estimating: '#estimating', proposal: '#proposal' },
      onClick: function(key) { setTab(key); }
    });
  }

  function setTab(tab, noPush) {
    if (TABS.indexOf(tab) < 0) tab = 'overview';
    var prevTab = currentTab;
    currentTab = tab;
    syncUrl(!noPush && tab !== prevTab);
    TABS.forEach(function(k) { $('body-' + k).hidden = (k !== tab); });
    var frameMode = (tab === 'takeoff' || tab === 'estimating');
    $('bpMain').classList.toggle('frame-mode', frameMode);
    document.body.classList.toggle('bp-frame-mode', frameMode);
    document.body.classList.toggle('bp-strip-hidden', tab === 'overview' || tab === 'documents');
    renderTitle();
    renderTabs();
    if (tab === 'overview') { loadEstSummary(); }
    if (tab === 'documents') { loadDocs(); }
    if (tab === 'takeoff') { ensureFrame('takeoff'); }
    if (tab === 'estimating') { ensureFrame('estimating'); }
    if (tab === 'proposal') { openProposal(); }
    if (frameMode) sizeFrames();
  }

  // ─── embedded takeoff.html / estimating.html ─────────────────────
  function frameSrc(key) {
    var page = key === 'takeoff' ? 'takeoff.html' : 'estimating.html';
    return page + '?est=' + currentVersion.id + '&embed=1';
  }
  function ensureFrame(key) {
    if (frames[key]) return frames[key];
    var f = document.createElement('iframe');
    f.id = key === 'takeoff' ? 'takeoffFrame' : 'estFrame';
    f.className = 'bp-frame';
    f.setAttribute('title', key === 'takeoff' ? 'Takeoff' : 'Estimating');
    f.src = frameSrc(key);
    $('body-' + key).appendChild(f);
    frames[key] = f;
    frameReady[key] = false;
    return f;
  }
  function reloadFrames() {
    ['takeoff','estimating'].forEach(function(k) {
      if (frames[k]) { frameReady[k] = false; pendingCmds[k] = []; frames[k].src = frameSrc(k); }
    });
  }
  function sizeFrames() {
    ['takeoff','estimating'].forEach(function(k) {
      var f = frames[k]; if (!f || $('body-' + k).hidden) return;
      var top = f.getBoundingClientRect().top;
      // .pc-est-strip is position:fixed (offsetParent is null for fixed elements) → measure its rect instead
      var strip = document.querySelector('.pc-est-strip');
      var hidden = document.body.classList.contains('bp-strip-hidden');
      var stripH = (!hidden && strip) ? strip.getBoundingClientRect().height : 0;
      var h = window.innerHeight - top - stripH;   // body.bp-frame-mode cancels the has-est-strip padding
      f.style.height = Math.max(420, h) + 'px';
    });
  }
  function sendCmd(key, cmd, payload) {
    var f = ensureFrame(key);
    var msg = { type: 'nw-cmd', cmd: cmd, payload: payload || {} };
    if (!frameReady[key]) { pendingCmds[key].push(msg); return; }
    if (typeof PC.sendCmd === 'function') PC.sendCmd(f, cmd, payload || {});
    else if (f.contentWindow) f.contentWindow.postMessage(msg, '*');
  }
  function onFrameMessage(e) {
    if (e.origin !== location.origin) return;   // only our own embedded takeoff.html / estimating.html
    var d = e.data;
    if (!d || d.type !== 'nw-event') return;
    var key = null;
    if (frames.takeoff && e.source === frames.takeoff.contentWindow) key = 'takeoff';
    else if (frames.estimating && e.source === frames.estimating.contentWindow) key = 'estimating';
    var p = d.payload || {};
    if (d.event === 'ready') {
      if (key) {
        frameReady[key] = true;
        var q = pendingCmds[key]; pendingCmds[key] = [];
        q.forEach(function(m) { frames[key].contentWindow.postMessage(m, '*'); });
      }
      sizeFrames();
    } else if (d.event === 'totals') {
      linesCache = null;
      if (PC.estStrip && typeof PC.estStrip.refresh === 'function') PC.estStrip.refresh();
      refreshVersionSettings();   // the iframe may have written settings.markups / manual_groups / es_settings
    } else if (d.event === 'navigate') {
      if (p.href) { location.href = p.href; return; }   // e.g. est-strip "Set as primary" → reload on the new root
      if (p.tab) setTab(p.tab);
    } else if (d.event === 'title') {
      if (p.name) {
        currentVersion.name = p.name;
        if (currentVersion.id === currentEstimate.id) currentEstimate.name = p.name;
        var h = $('titleHost').querySelector('.pc-h1'); if (h) h.textContent = p.name;
        $('ovName').value = p.name;
        document.title = (currentVersion.quote_number ? 'Q' + currentVersion.quote_number + ' · ' : '') + p.name + ' — NWAC';
      }
    }
  }

  // ─── bottom estimate version strip (renderStrip = init only; later use PC.estStrip.setCurrent / refresh) ───
  function renderStrip() {
    if (typeof PC.estStrip !== 'function') return;
    document.querySelectorAll('.pc-est-strip').forEach(function(el) { el.remove(); });
    PC.estStrip(document.body, {
      rootId: rootId(),
      currentId: currentVersion.id,
      canEdit: canEdit,
      onSwitch: switchVersion
    });
    sizeFrames();
  }
  async function switchVersion(id) {
    if (!id || id === currentVersion.id) return;
    var r = await supabaseClient.from('estimates').select('*').eq('id', id).maybeSingle();
    if (r.error || !r.data) { toast('Version not found', 'error'); return; }
    currentVersion = r.data;
    if (currentVersion.id === currentEstimate.id) currentEstimate = currentVersion;
    linesCache = null; propSettings = null; propLoadedFor = null; estimatorEmailCache = {};
    syncUrl();
    reloadFrames();
    hydrateOverview();
    renderTitle();
    if (PC.estStrip && typeof PC.estStrip.setCurrent === 'function') PC.estStrip.setCurrent(currentVersion.id);
    if (currentTab === 'proposal') openProposal();
    if (currentTab === 'overview') loadEstSummary();
  }

  // ─── stage ───────────────────────────────────────────────────────
  async function updateStage(key) {
    if (!canEdit) return viewOnly();
    if (!key) return;
    var upd = await supabaseClient.from('estimates').update({
      bid_stage: key,
      archived_at: key === 'archived' ? new Date().toISOString() : null
    }).eq('id', rootId());
    if (upd.error) { toast('Stage update failed: ' + upd.error.message, 'error'); return; }
    currentEstimate.bid_stage = key;
    currentEstimate.archived_at = key === 'archived' ? new Date().toISOString() : null;
    toast('Stage → ' + key.replace(/_/g, ' '), 'success');
    renderTitle();
  }

  // ─── project kebab actions (all via BidActions + PC dialogs) ─────
  function needActions() { if (!window.BidActions) { toast('bid-actions.js not loaded', 'error'); return false; } return true; }
  async function copyProject() {
    if (!canEdit) return viewOnly(); if (!needActions()) return;
    var name = await PC.prompt({ title: 'Copy Project', label: 'New project name', value: (currentEstimate.name || 'Untitled') + ' (copy)', okLabel: 'Copy' });
    if (!name) return;
    try {
      var newId = await BidActions.copyProject(rootId(), { name: name, asTemplate: false });
      toast('Project copied — opening…', 'success');
      if (newId) setTimeout(function() { location.href = 'bid-project.html?id=' + newId + '#overview'; }, 500);
    } catch(e) { toast('Copy failed: ' + (e.message || e), 'error'); }
  }
  async function copyToTemplate() {
    if (!canEdit) return viewOnly(); if (!needActions()) return;
    var name = await PC.prompt({ title: 'Copy Project to Template', label: 'Template name', value: (currentEstimate.name || 'Untitled') + ' Template', okLabel: 'Create template' });
    if (!name) return;
    try {
      await BidActions.copyProject(rootId(), { name: name, asTemplate: true });
      toast('Template created: ' + name, 'success');
    } catch(e) { toast('Failed: ' + (e.message || e), 'error'); }
  }
  async function setAsTemplate() {
    if (!canEdit) return viewOnly(); if (!needActions()) return;
    if (!(await PC.confirm({ title: 'Set Project as Template', message: 'Mark "' + (currentEstimate.name || '') + '" as a project template? It will appear in the template list when creating new projects.', okLabel: 'Set as template' }))) return;
    try { await BidActions.setTemplate(rootId()); currentEstimate.is_template = true; toast('Project is now a template', 'success'); }
    catch(e) { toast('Failed: ' + (e.message || e), 'error'); }
  }
  async function setAsDefaultTemplate() {
    if (!canEdit) return viewOnly(); if (!needActions()) return;
    if (!(await PC.confirm({ title: 'Set Project as Default Template', message: 'Use "' + (currentEstimate.name || '') + '" as the default template for new projects?', okLabel: 'Set as default' }))) return;
    try { await BidActions.setDefaultTemplate(rootId()); currentEstimate.is_template = true; toast('Default template set', 'success'); }
    catch(e) { toast('Failed: ' + (e.message || e), 'error'); }
  }
  async function applyTemplateDialog() {
    if (!canEdit) return viewOnly(); if (!needActions()) return;
    var q = await supabaseClient.from('estimates').select('id,name,quote_number,settings').eq('is_template', true).neq('id', rootId()).order('name');
    var tpls = q.data || [];
    var body = document.createElement('div');
    if (!tpls.length) body.innerHTML = '<div class="pc-empty">No project templates yet. Use "Copy Project to Template" or "Set Project as Template" first.</div>';
    else body.innerHTML =
      '<div class="pc-banner-info" style="margin-bottom:12px">Takeoff and estimate items from the template will be merged into the current estimate (' + esc(currentVersion.version_label || 'Original Estimate') + ').</div>' +
      '<div class="pc-field"><label class="pc-label">Select project template you want to apply on your project</label>' +
      '<select class="pc-select" id="tplPick"><option value="">— Select template —</option>' +

  var saveTimers = {};
  function queueSave(col, val) {
    clearTimeout(saveTimers[col]);
    saveTimers[col] = setTimeout(function() {
      var patch = {}; patch[col] = val;
      var p = PC.saveField('estimates', currentVersion.id, patch, { silent: true });   // Procore autosaves silently; errors still toast
      currentVersion[col] = val;
      if (currentVersion.id === currentEstimate.id) currentEstimate[col] = val;
      if (p && typeof p.then === 'function') p.catch(function(e) { console.warn(e); });
    }, 600);
  }
  // Re-read estimates.settings before merging: the embedded estimating.html writes settings.markups /
  // manual_groups / es_settings / labor_sales_rate while the user works, so the parent's in-memory copy
  // may be stale and an UPDATE from it would silently drop those keys.
  async function refreshVersionSettings() {
    if (!currentVersion || schemaMissing) return settingsOf(currentVersion);
    try {
      var cur = await supabaseClient.from('estimates').select('settings').eq('id', currentVersion.id).maybeSingle();
      if (!cur.error && cur.data && cur.data.settings && typeof cur.data.settings === 'object') {
        currentVersion.settings = cur.data.settings;
        if (currentVersion.id === currentEstimate.id) currentEstimate.settings = cur.data.settings;
      }
    } catch(e) { console.warn(e); }
    return settingsOf(currentVersion);
  }
  async function saveSettings(patch) {
    var base = await refreshVersionSettings();
    var s = Object.assign({}, base, patch);
    var r = await supabaseClient.from('estimates').update({ settings: s }).eq('id', currentVersion.id);
    if (r.error) {
      if (/settings/i.test(r.error.message || '')) showSchemaBanner();
      toast('Settings not saved: ' + r.error.message, 'error');
      return false;
    }
    currentVersion.settings = s;
    if (currentVersion.id === currentEstimate.id) currentEstimate.settings = s;
    return true;
  }
