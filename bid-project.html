    Array.prototype.forEach.call(host.querySelectorAll('input[data-task-id]'), function(cb) {
      cb.addEventListener('change', async function() {
        var r = await supabaseClient.from('bid_project_tasks').update({ is_done: cb.checked, completed_at: cb.checked ? new Date().toISOString() : null }).eq('id', cb.getAttribute('data-task-id'));
        if (r.error) toast('Update failed: ' + r.error.message, 'error');
        loadNotesTasks();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-task-kebab]'), function(el) {
      var id = el.getAttribute('data-task-kebab');
      var t = tasks.find(function(x) { return x.id === id; });
      el.innerHTML = PC.kebab([
        { label: 'Edit', icon: 'edit', disabled: !canEdit, onClick: function() { openTaskDialog(t); } },
        { label: 'Delete', icon: 'delete', danger: true, disabled: !canEdit, onClick: async function() {
          if (!(await PC.confirm({ title: 'Delete task', message: 'Delete "' + t.title + '"?', okLabel: 'Delete', danger: true }))) return;
          var d = await supabaseClient.from('bid_project_tasks').delete().eq('id', id);
          if (d.error) { toast('Delete failed: ' + d.error.message, 'error'); return; }
          loadNotesTasks();
        } }
      ]);
    });
  }
  async function openTaskDialog(task) {
    if (!canEdit) return viewOnly();
    var people = await loadProfiles();
    var body = document.createElement('div');
    body.innerHTML =
      '<div class="pc-field"><label class="pc-label">Title *</label><input class="pc-input" id="tkTitle" value="' + esc(task ? task.title : '') + '"></div>' +
      '<div class="pc-grid2"><div class="pc-field"><label class="pc-label">Due date</label><input class="pc-input" type="date" id="tkDue" value="' + esc(task ? (task.due_date || '') : '') + '"></div>' +
      '<div class="pc-field"><label class="pc-label">Assignee</label><select class="pc-select" id="tkWho"><option value="">— Unassigned —</option>' +
        people.map(function(p) { return '<option value="' + p.id + '"' + (task && task.assignee_id === p.id ? ' selected' : '') + '>' + esc(p.full_name || p.email) + '</option>'; }).join('') +
      '</select></div></div>';
    var m = PC.modal({ title: task ? 'Edit Task' : 'Create a Task', body: body, size: 'sm', buttons: [
      { label: 'Cancel', onClick: function() { m.close(); } },
      { label: task ? 'Update' : 'Create', primary: true, closeOnDone: false, onClick: async function() {
        // return false on every error path: PC.modal closes the dialog when an async onClick resolves to anything else
        var title = (body.querySelector('#tkTitle').value || '').trim();
        if (!title) { toast('Title is required', 'error'); return false; }
        var row = { title: title, due_date: body.querySelector('#tkDue').value || null, assignee_id: body.querySelector('#tkWho').value || null };
        var r;
        try {
          if (task) r = await supabaseClient.from('bid_project_tasks').update(row).eq('id', task.id);
          else { row.estimate_id = rootId(); row.created_by = currentUser ? currentUser.id : null; r = await supabaseClient.from('bid_project_tasks').insert(row); }
        } catch(e) { toast('Task save failed: ' + (e.message || e), 'error'); return false; }
        if (r.error) { toast('Task save failed: ' + r.error.message, 'error'); return false; }
        m.close(); loadNotesTasks();
      } }
    ] });
    setTimeout(function() { var i = body.querySelector('#tkTitle'); if (i) i.focus(); }, 50);
  }

  // ═══════════════════════════════════════════════════════════════
  //  DOCUMENTS
  // ═══════════════════════════════════════════════════════════════
  var drawings = [], attachments = [];
  var docSel = { type: 'drawings', id: null };
  var docsLoadedOnce = false;
  var thumbGen = 0;

  function bindDocuments() {
    $('docSortDir').setAttribute('data-dir', 'asc');
    $('docSortDir').innerHTML = icon('arrow_upward');
    $('docSortDir').addEventListener('click', function() {
      var d = $('docSortDir').getAttribute('data-dir') === 'asc' ? 'desc' : 'asc';
      $('docSortDir').setAttribute('data-dir', d);
      $('docSortDir').innerHTML = icon(d === 'asc' ? 'arrow_upward' : 'arrow_downward');
      renderDocList();
    });
    $('docSort').addEventListener('change', renderDocList);
    $('docSearch').addEventListener('input', debounce(renderDocList, 200));
    $('docThumbSize').addEventListener('input', debounce(function() { if (docSel.type === 'drawing') renderDocList(); }, 250));
    $('docSearch').insertAdjacentHTML('afterend', icon('search'));
    $('docTreeKebab').innerHTML = PC.kebab([
      { label: 'Upload drawings', icon: 'upload', disabled: !canEdit, onClick: openUploadDrawings },
      { label: 'Upload attachment', icon: 'upload', disabled: !canEdit, onClick: openUploadAttachment },
      { sep: true },
      { label: 'Open full documents page', icon: 'open_in_new', onClick: function() { location.href = 'project-files.html?estimate=' + rootId(); } }
    ]);
    $('docListKebab').innerHTML = PC.kebab([
      { label: 'Upload', icon: 'upload', disabled: !canEdit, onClick: function() { if (docSel.type === 'attachments') openUploadAttachment(); else openUploadDrawings(); } },
      { label: 'Auto-rename sheets', icon: 'auto_awesome', disabled: !canEdit, onClick: autoRenameDrawings },
      { label: 'Refresh', icon: 'refresh', onClick: loadDocs }
    ]);
    $('drawingFileInput').addEventListener('change', function() {
      var files = Array.prototype.slice.call($('drawingFileInput').files || []);
      $('drawingFileInput').value = '';
      if (files.length) uploadDrawings(files);
    });
  }

  async function loadDocs() {
    var d = await supabaseClient.from('estimate_drawings').select('*').eq('estimate_id', rootId()).order('created_at');
    if (d.error) { $('docList').innerHTML = '<div class="pc-empty" style="color:#dc2626">' + esc(d.error.message) + '</div>'; return; }
    drawings = d.data || [];
    var a = await supabaseClient.from('project_files').select('id, filename, size_bytes, category, storage_path, content_type, uploaded_by, created_at').eq('estimate_id', rootId()).order('created_at', { ascending: false });
    attachments = a.error ? [] : (a.data || []);
    if (docSel.type === 'drawing' && !drawings.some(function(x) { return x.id === docSel.id; })) docSel = { type: 'drawings', id: null };
    docsLoadedOnce = true;
    renderDocTree();
    renderDocList();
    fillProposalFiles();
  }

  function pageTotal() { return drawings.reduce(function(s, d) { return s + (Number(d.page_count) || 0); }, 0); }

  function renderDocTree() {
    var host = $('docTree');
    var html = '';
    html += '<div class="bp-tree-row' + (docSel.type === 'drawings' ? ' sel' : '') + '" data-sel="drawings"><span class="ic">' + icon('layers') + '</span><span class="nm">Drawings</span><span class="cnt">' + pageTotal() + '</span><span data-tree-kebab="drawings"></span></div>';
    drawings.forEach(function(d) {
      html += '<div class="bp-tree-row sub' + (docSel.type === 'drawing' && docSel.id === d.id ? ' sel' : '') + '" data-sel="drawing" data-id="' + d.id + '"><span class="ic">' + icon('folder', 16) + '</span><span class="nm" title="' + esc(d.filename) + '">' + esc(d.filename) + '</span><span class="cnt">' + (d.page_count || 1) + '</span><span data-tree-kebab="drawing" data-id="' + d.id + '"></span></div>';
    });
    html += '<div class="bp-tree-row' + (docSel.type === 'attachments' ? ' sel' : '') + '" data-sel="attachments"><span class="ic">' + icon('description') + '</span><span class="nm">Attachments</span><span class="cnt">' + attachments.length + '</span><span data-tree-kebab="attachments"></span></div>';
    host.innerHTML = html;
    Array.prototype.forEach.call(host.querySelectorAll('[data-sel]'), function(row) {
      row.addEventListener('click', function(ev) {
        if (ev.target.closest('.pc-kebab')) return;
        docSel = { type: row.getAttribute('data-sel'), id: row.getAttribute('data-id') || null };
        renderDocTree(); renderDocList();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-tree-kebab]'), function(el) {
      var kind = el.getAttribute('data-tree-kebab');
      if (kind === 'drawings') el.innerHTML = PC.kebab([
        { label: 'Upload drawings', icon: 'upload', disabled: !canEdit, onClick: openUploadDrawings },
        { label: 'Auto-rename sheets', icon: 'auto_awesome', disabled: !canEdit, onClick: autoRenameDrawings }
      ]);
      else if (kind === 'attachments') el.innerHTML = PC.kebab([
        { label: 'Upload attachment', icon: 'upload', disabled: !canEdit, onClick: openUploadAttachment },
        { label: 'Open full documents page', icon: 'open_in_new', onClick: function() { location.href = 'project-files.html?estimate=' + rootId(); } }
      ]);
      else {
        var d = drawings.find(function(x) { return x.id === el.getAttribute('data-id'); });
        el.innerHTML = PC.kebab(drawingMenu(d));
      }
    });
  }

  function drawingMenu(d) {
    return [
      { label: 'Rename', icon: 'edit', disabled: !canEdit, onClick: function() { renameDrawing(d); } },
      { label: 'Start Takeoff', icon: 'straighten', onClick: function() { startTakeoffOn(d, 1); } },
      { label: 'Download', icon: 'download', onClick: function() { downloadDrawing(d); } },
      { sep: true },
      { label: 'Delete', icon: 'delete', danger: true, disabled: !canEdit, onClick: function() { deleteDrawing(d); } }
    ];
  }
  function startTakeoffOn(d, page) {
    setTab('takeoff');
    sendCmd('takeoff', 'openPlan', { drawingId: d.id, page: page || 1 });
  }
  async function renameDrawing(d) {
    if (!canEdit) return viewOnly();
    var name = await PC.prompt({ title: 'Rename drawing', label: 'File name', value: d.filename, okLabel: 'Rename' });
    if (!name || name === d.filename) return;
    if (!window.EstDrawings) { toast('est-drawings.js not loaded', 'error'); return; }
    try { await EstDrawings.rename(d.id, name); d.filename = name; toast('Renamed', 'success'); renderDocTree(); renderDocList(); }
    catch(e) { toast('Rename failed: ' + (e.message || e), 'error'); }
  }
  async function deleteDrawing(d) {
    if (!canEdit) return viewOnly();
    var ok = await PC.confirm({ title: 'Delete drawing', message: 'Delete "' + d.filename + '"? All takeoff measurements drawn on its ' + (d.page_count || 1) + ' page(s) — in every estimate version — will be deleted too.', okLabel: 'Delete', danger: true });
    if (!ok) return;
    if (!window.EstDrawings) { toast('est-drawings.js not loaded', 'error'); return; }
    try { await EstDrawings.remove(d); toast('Drawing deleted', 'success'); loadDocs(); }
    catch(e) { toast('Delete failed: ' + (e.message || e), 'error'); }
  }
  async function downloadDrawing(d) {
    if (!window.EstDrawings) { toast('est-drawings.js not loaded', 'error'); return; }
    try { var url = await EstDrawings.signedUrl(d.storage_path, { download: true }); if (url) window.open(url, '_blank'); }
    catch(e) { toast('Download failed: ' + (e.message || e), 'error'); }
  }

  function sortRows(rows, nameOf, dateOf) {
    var by = $('docSort').value, dir = $('docSortDir').getAttribute('data-dir') === 'desc' ? -1 : 1;
    var out = rows.slice();
    if (by === 'name') out.sort(function(a, b) { return nameOf(a).localeCompare(nameOf(b), undefined, { numeric: true }) * dir; });
    else if (by === 'date') out.sort(function(a, b) { return (String(dateOf(a)) < String(dateOf(b)) ? -1 : 1) * dir; });
    else if (dir < 0) out.reverse();
    return out;
  }

  function renderDocList() {
    var host = $('docList');
    var q = ($('docSearch').value || '').toLowerCase().trim();
    thumbGen++;
    if (docSel.type === 'attachments') {
      $('docFolderTitle').textContent = 'Attachments';
      var rows = sortRows(attachments.filter(function(f) { return !q || (f.filename || '').toLowerCase().indexOf(q) >= 0; }), function(f) { return f.filename || ''; }, function(f) { return f.created_at; });
      if (!rows.length) { host.innerHTML = '<div class="pc-empty">No attachments yet.</div>'; return; }
      host.innerHTML = rows.map(function(f) {
        var kb = f.size_bytes ? (f.size_bytes > 1048576 ? (f.size_bytes / 1048576).toFixed(1) + ' MB' : Math.round(f.size_bytes / 1024) + ' KB') : '';
        return '<div class="bp-doc-row"><span class="ic">' + icon('description') + '</span><div class="nm" data-open-att="' + f.id + '"><div>' + esc(f.filename) + '</div><div class="sub">' + esc([f.category || 'other', kb, PC.date(f.created_at)].filter(Boolean).join(' · ')) + '</div></div><span data-att-kebab="' + f.id + '"></span></div>';
      }).join('');
      Array.prototype.forEach.call(host.querySelectorAll('[data-open-att]'), function(el) { el.addEventListener('click', function() { downloadAttachment(attachments.find(function(x) { return x.id === el.getAttribute('data-open-att'); }), false); }); });
      Array.prototype.forEach.call(host.querySelectorAll('[data-att-kebab]'), function(el) {
        var f = attachments.find(function(x) { return x.id === el.getAttribute('data-att-kebab'); });
        el.innerHTML = PC.kebab([
          { label: 'Rename', icon: 'edit', disabled: !canEdit, onClick: async function() {
            var name = await PC.prompt({ title: 'Rename attachment', label: 'File name', value: f.filename, okLabel: 'Rename' });
            if (!name || name === f.filename) return;
            var r = await supabaseClient.from('project_files').update({ filename: name }).eq('id', f.id);
            if (r.error) { toast('Rename failed: ' + r.error.message, 'error'); return; }
            f.filename = name; toast('Renamed', 'success'); renderDocList();
          } },
          { label: 'Download', icon: 'download', onClick: function() { downloadAttachment(f, true); } },
          { sep: true },
          { label: 'Delete', icon: 'delete', danger: true, disabled: !canEdit, onClick: async function() {
            if (!(await PC.confirm({ title: 'Delete attachment', message: 'Delete "' + f.filename + '" permanently?', okLabel: 'Delete', danger: true }))) return;
            if (f.storage_path) await supabaseClient.storage.from('project-files').remove([f.storage_path]);
            var d = await supabaseClient.from('project_files').delete().eq('id', f.id);
            if (d.error) { toast('Delete failed: ' + d.error.message, 'error'); return; }
            toast('Deleted', 'success'); loadDocs();
          } }
        ]);
      });
      return;
    }
    if (docSel.type === 'drawing') {
      var d = drawings.find(function(x) { return x.id === docSel.id; });
      if (!d) { docSel = { type: 'drawings', id: null }; renderDocTree(); renderDocList(); return; }
      $('docFolderTitle').textContent = d.filename;
      var w = parseInt($('docThumbSize').value, 10) || 142;
      var pages = [];
      for (var p = 1; p <= (d.page_count || 1); p++) { var meta = (d.page_meta || {})[String(p)] || {}; pages.push({ n: p, label: meta.sheet || ('Page ' + p), scale: meta.scale || null }); }
      pages = sortRows(pages.filter(function(pg) { return !q || pg.label.toLowerCase().indexOf(q) >= 0 || ('page ' + pg.n).indexOf(q) >= 0; }), function(pg) { return pg.label; }, function(pg) { return String(pg.n).padStart(5, '0'); });
      if (!pages.length) { host.innerHTML = '<div class="pc-empty">No pages match.</div>'; return; }
      host.innerHTML = '<div class="bp-doc-grid">' + pages.map(function(pg) {
        return '<div class="bp-page-tile" style="width:' + w + 'px" data-page="' + pg.n + '"><div class="th" data-open-page="' + pg.n + '" style="min-height:' + Math.round(w * 0.7) + 'px"><span class="pc-muted" style="font-size:11px">' + icon('description') + '</span></div>' +
          '<div class="cap"><span class="nm" title="' + esc(pg.label) + '">' + esc(pg.label) + '</span>' + (pg.scale ? '<span class="sc">' + esc(pg.scale) + '</span>' : '') + '<span data-page-kebab="' + pg.n + '"></span></div></div>';
      }).join('') + '</div>';
      Array.prototype.forEach.call(host.querySelectorAll('[data-open-page]'), function(el) { el.addEventListener('click', function() { startTakeoffOn(d, parseInt(el.getAttribute('data-open-page'), 10)); }); });
      Array.prototype.forEach.call(host.querySelectorAll('[data-page-kebab]'), function(el) {
        var n = parseInt(el.getAttribute('data-page-kebab'), 10);
        el.innerHTML = PC.kebab([
          { label: 'Rename', icon: 'edit', disabled: !canEdit, onClick: async function() {
            var cur = ((d.page_meta || {})[String(n)] || {}).sheet || '';
            var name = await PC.prompt({ title: 'Rename sheet', label: 'Sheet number / name', value: cur, placeholder: 'M-101', okLabel: 'Rename' });
            if (name == null) return;
            var meta = Object.assign({}, d.page_meta || {}); meta[String(n)] = Object.assign({}, meta[String(n)] || {}, { sheet: name.trim() || null });
            var r = await supabaseClient.from('estimate_drawings').update({ page_meta: meta }).eq('id', d.id);
            if (r.error) { toast('Rename failed: ' + r.error.message, 'error'); return; }
            d.page_meta = meta; renderDocList();
          } },
          { label: 'Start Takeoff', icon: 'straighten', onClick: function() { startTakeoffOn(d, n); } },
          { label: 'Download', icon: 'download', onClick: function() { downloadDrawing(d); } },
          { sep: true },
          { label: 'Delete', icon: 'delete', danger: true, disabled: !canEdit, onClick: function() { deleteDrawing(d); } }
        ]);
      });
      loadThumbs(d, pages, w, thumbGen);
      return;
    }
    // Drawings root — one row per drawing set
    $('docFolderTitle').textContent = 'Custom Drawings';
    var sets = sortRows(drawings.filter(function(x) { return !q || (x.filename || '').toLowerCase().indexOf(q) >= 0; }), function(x) { return x.filename || ''; }, function(x) { return x.created_at; });
    if (!sets.length) {
      host.innerHTML = '<div class="pc-empty">No drawings uploaded yet.' + (canEdit ? '<br><button type="button" class="pc-btn pc-btn-primary" id="docEmptyUpload" style="margin-top:12px">Upload</button>' : '') + '</div>';
      var b = $('docEmptyUpload'); if (b) b.addEventListener('click', openUploadDrawings);
      return;
    }
    host.innerHTML = sets.map(function(x) {
      return '<div class="bp-doc-row"><span class="ic">' + icon('folder') + '</span><div class="nm" data-open-set="' + x.id + '"><div>' + esc(x.filename) + '</div><div class="sub">' + (x.page_count || 1) + ' page' + ((x.page_count || 1) === 1 ? '' : 's') + ' · ' + esc(PC.date(x.created_at)) + '</div></div><span data-set-kebab="' + x.id + '"></span></div>';
    }).join('');
    Array.prototype.forEach.call(host.querySelectorAll('[data-open-set]'), function(el) { el.addEventListener('click', function() { docSel = { type: 'drawing', id: el.getAttribute('data-open-set') }; renderDocTree(); renderDocList(); }); });
    Array.prototype.forEach.call(host.querySelectorAll('[data-set-kebab]'), function(el) {
      var x = drawings.find(function(y) { return y.id === el.getAttribute('data-set-kebab'); });
      el.innerHTML = PC.kebab(drawingMenu(x));
    });
  }

  async function loadThumbs(d, pages, w, gen) {
    if (!window.EstDrawings || typeof EstDrawings.thumbnail !== 'function') return;
    for (var i = 0; i < pages.length; i++) {
      if (gen !== thumbGen) return;
      var tile = $('docList').querySelector('.bp-page-tile[data-page="' + pages[i].n + '"] .th');
      if (!tile) continue;
      try {
        var url = await EstDrawings.thumbnail(d, pages[i].n, w);
        if (gen !== thumbGen) return;
        if (url) tile.innerHTML = '<img src="' + url + '" alt="">';
      } catch(e) { /* keep placeholder */ }
    }
  }

  async function downloadAttachment(f, forceDownload) {
    if (!f) return;
    if (!f.storage_path) { toast('This file lives on Google Drive — open it from the full documents page', 'error'); return; }
    var r = await supabaseClient.storage.from('project-files').createSignedUrl(f.storage_path, 3600, forceDownload ? { download: f.filename } : undefined);
    if (r.error || !r.data) { toast('Could not open file: ' + (r.error ? r.error.message : ''), 'error'); return; }
    window.open(r.data.signedUrl, '_blank');
  }

  // ─── uploads (drawings → estimate_drawings ONLY; attachments → project_files) ───
  function openUploadDrawings() {
    if (!canEdit) return viewOnly();
    $('drawingFileInput').click();
  }
  async function uploadDrawings(files) {
    if (!window.EstDrawings) { toast('est-drawings.js not loaded', 'error'); return; }
    var pdfs = files.filter(function(f) { return /\.pdf$/i.test(f.name) || f.type === 'application/pdf'; });
    if (!pdfs.length) { toast('Drawings must be PDF files', 'error'); return; }
    toast('Uploading ' + pdfs.length + ' drawing' + (pdfs.length === 1 ? '' : 's') + '…');
    try {
      // EstDrawings.upload never throws per file: it returns {rows, errors}; onProgress gets one {index,total,file,stage} object
      var res = await EstDrawings.upload(rootId(), pdfs, { onProgress: function(info) {
        if (info && info.total > 1 && info.stage === 'upload') toast('Uploading ' + (info.index + 1) + ' of ' + info.total + (info.file ? ' — ' + info.file.name : ''));
      } });
      var errs = (res && res.errors) || [], rows = (res && res.rows) || [];
      errs.forEach(function(er) { toast(er.message || 'Upload failed', 'error'); });
      if (rows.length) toast('Uploaded ' + rows.length + ' drawing' + (rows.length === 1 ? '' : 's'), 'success');
    } catch(e) { toast('Upload failed: ' + (e.message || e), 'error'); }
    if (currentTab !== 'documents') setTab('documents'); else loadDocs();
  }
  function openUploadAttachment() {
    if (!canEdit) return viewOnly();
    var body = document.createElement('div');
    body.innerHTML =
      '<div class="pc-field"><label class="pc-label">Files</label><input class="pc-input" type="file" id="attFiles" multiple style="padding-top:6px"></div>' +
      '<div class="pc-field"><label class="pc-label">Category</label><select class="pc-select" id="attCat"><option value="other">Other</option><option value="quotes">Quotes</option><option value="specs">Specs</option></select></div>' +
      '<div class="pc-field"><label class="pc-label">Notes</label><input class="pc-input" id="attNotes"></div>';
    var m = PC.modal({ title: 'Upload attachment', body: body, size: 'sm', buttons: [
      { label: 'Cancel', onClick: function() { m.close(); } },
      { label: 'Upload', primary: true, closeOnDone: false, onClick: async function() {
        // return false on error paths so PC.modal keeps the dialog (and the picked files) open
        var files = Array.prototype.slice.call(body.querySelector('#attFiles').files || []);
        if (!files.length) { toast('Pick at least one file', 'error'); return false; }
        var category = body.querySelector('#attCat').value, notes = (body.querySelector('#attNotes').value || '').trim() || null;
        var ok = 0, failed = 0;
        for (var i = 0; i < files.length; i++) {
          var file = files[i];
          var path = 'est-' + rootId() + '/' + Date.now() + '_' + i + '_' + file.name.replace(/[^A-Za-z0-9._-]/g, '_');
          try {
            var up = await supabaseClient.storage.from('project-files').upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type || null });
            if (up.error) { toast('Upload failed for ' + file.name + ': ' + up.error.message, 'error'); failed++; continue; }
            var ins = await supabaseClient.from('project_files').insert({ estimate_id: rootId(), filename: file.name, storage_path: path, size_bytes: file.size, content_type: file.type || null, category: category, notes: notes, uploaded_by: currentUser ? currentUser.id : null });
            if (ins.error) { toast('Row insert failed for ' + file.name + ': ' + ins.error.message, 'error'); failed++; continue; }
          } catch(e) { toast('Upload failed for ' + file.name + ': ' + (e.message || e), 'error'); failed++; continue; }
          ok++;
        }
        if (ok) toast('Uploaded ' + ok + ' file' + (ok === 1 ? '' : 's'), 'success');
        if (ok) { docSel = { type: 'attachments', id: null }; loadDocs(); }
        if (failed && !ok) return false;   // nothing went through — keep the dialog open for a retry
        m.close();
      } }
    ] });
  }
  async function autoRenameDrawings() {
    if (!canEdit) return viewOnly();
    if (!window.EstDrawings || typeof EstDrawings.detectSheets !== 'function') { toast('est-drawings.js not loaded', 'error'); return; }
    if (!docsLoadedOnce) await loadDocs();
    if (!drawings.length) { toast('No drawings to rename', 'error'); return; }
    toast('Detecting sheet numbers and scales…');
    var n = 0;
    for (var i = 0; i < drawings.length; i++) {
      try { await EstDrawings.detectSheets(drawings[i]); n++; } catch(e) { console.warn(e); }
    }
    toast('Auto-rename finished for ' + n + ' drawing' + (n === 1 ? '' : 's'), 'success');
    loadDocs();
  }

  // ═══════════════════════════════════════════════════════════════
  //  PROPOSAL
  // ═══════════════════════════════════════════════════════════════
  var propSettings = null, propLoadedFor = null, propDirty = false, estimatorEmailCache = {};
  var propSaveTimer = null, propHtmlTimer = null;

  var PROP_SCHEMA = [
    { sec: 'Layout' },
    { sel: 'layout', options: [['letter', 'NWAC letter (template)'], ['detailed', 'Detailed (by group)']] },
    { sel: 'r410a', options: [['auto', 'R-410A notes: automatic'], ['on', 'R-410A notes: always'], ['off', 'R-410A notes: never']] },
    { sec: 'Quick Simplification' },
    { sw: 'groupsOnly', label: 'Groups Only' }, { sw: 'lumpSum', label: 'Lump Sum' },
    { sec: 'Material Details' },
    { sw: 'quantity', label: 'Quantity' }, { sw: 'assemblyItems', label: 'Assembly Items', disabled: true, tip: 'Needs catalog link' },
    { sw: 'itemTotalCost', label: 'Item Total Cost' }, { sw: 'combinedUnitCost', label: 'Combined Unit Cost' },
    { sw: 'groupSubtotals', label: 'Group Subtotals' }, { sw: 'manufacturer', label: 'Manufacturer' },
    { sw: 'catalogNumber', label: 'Catalog Number' }, { sw: 'description', label: 'Description' },
    { sec: 'Group By' },
    { sel: 'groupBy', options: [['groups', 'Groups'], ['assemblies', 'Assemblies'], ['categories', 'Categories']] },
    { sec: 'Summary Details' },
    { sw: 'summary.laborMaterials', label: 'Labor and Materials' }, { sw: 'summary.taxes', label: 'Taxes' },
    { sw: 'summary.overhead', label: 'Overhead' }, { sw: 'summary.profit', label: 'Profit' },
    { sw: 'summary.acceptedBy', label: 'Accepted By' }, { sw: 'summary.date', label: 'Date' },
    { sec: 'Rounding' },
    { sw: 'rounding.twoDecimals', label: 'Show 2 decimals' }, { sw: 'rounding.roundTotal', label: 'Round Proposal Total' },
    { sec: 'Price / sq ft' },
    { sw: 'sqft.costItems', label: 'Cost Items' }, { sw: 'sqft.groupSubtotals', label: 'Group Subtotals' },
    { sw: 'sqft.summary', label: 'Summary' }, { sw: 'sqft.estimateTotal', label: 'Estimate Total' },
    { sec: 'Edit Mode' },
    { sw: 'editMode', label: 'Edit Mode' }
  ];
  var DETAIL_SECS = ['Quick Simplification', 'Material Details', 'Group By', 'Price / sq ft'];
  var DETAIL_SW = ['summary.laborMaterials', 'summary.taxes', 'summary.overhead', 'summary.profit'];
  function getPath(o, p) { return p.split('.').reduce(function(a, k) { return a == null ? a : a[k]; }, o); }
  function setPath(o, p, v) { var ks = p.split('.'), cur = o; for (var i = 0; i < ks.length - 1; i++) { if (!cur[ks[i]] || typeof cur[ks[i]] !== 'object') cur[ks[i]] = {}; cur = cur[ks[i]]; } cur[ks[ks.length - 1]] = v; }

  function defaultPropSettings() {
    var d = (window.NWProposal && typeof NWProposal.defaultSettings === 'function') ? NWProposal.defaultSettings() : {};
    return Object.assign({
      groupsOnly: false, lumpSum: false, quantity: true, assemblyItems: false, itemTotalCost: true, combinedUnitCost: false, groupSubtotals: false,
      manufacturer: false, catalogNumber: false, description: false, groupBy: 'groups',
      summary: { laborMaterials: true, taxes: true, overhead: false, profit: false, acceptedBy: true, date: true },
      rounding: { twoDecimals: true, roundTotal: false },
      sqft: { costItems: false, groupSubtotals: false, summary: false, estimateTotal: false },
      editMode: false, htmlOverride: false, coverFileId: null, appendixFileId: null, contactName: '', contactEmail: ''
    }, d);
  }
  function loadPropSettings() {
    var def = defaultPropSettings();
    var stored = settingsOf(currentVersion).proposal || {};
    var s = Object.assign({}, def, stored);
    ['summary', 'rounding', 'sqft'].forEach(function(k) { s[k] = Object.assign({}, def[k] || {}, stored[k] || {}); });
    s.editMode = false;   // never start in edit mode
    propSettings = s;
  }
  function savePropSettings() {
    clearTimeout(propSaveTimer);
    propSaveTimer = setTimeout(function() {
      var copy = JSON.parse(JSON.stringify(propSettings)); copy.editMode = false;
      saveSettings({ proposal: copy });
    }, 600);
  }

  function bindProposal() {
    Array.prototype.forEach.call(document.querySelectorAll('.prop-btn[data-cmd]'), function(b) {
      b.addEventListener('mousedown', function(e) { e.preventDefault(); });
      b.addEventListener('click', function() { document.execCommand(b.getAttribute('data-cmd'), false, null); markPropDirty(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.prop-btn[data-block]'), function(b) {
      b.addEventListener('mousedown', function(e) { e.preventDefault(); });
      b.addEventListener('click', function() { document.execCommand('formatBlock', false, b.getAttribute('data-block')); markPropDirty(); });
    });
    $('propPaper').addEventListener('input', function() { if (propSettings && propSettings.editMode) markPropDirty(); });
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's' && currentTab === 'proposal') { e.preventDefault(); saveProposalHtml(true); }
    });
    // kebab items are functions so 'Save proposal' is only enabled while Edit Mode is on (saving the live render would freeze the proposal)
    $('propKebab').innerHTML = PC.kebab(function() { return [
      { label: 'Save proposal', icon: 'check', disabled: !canEdit || !(propSettings && propSettings.editMode), onClick: function() { saveProposalHtml(true); } },
      { label: 'Regenerate from estimate', icon: 'refresh', disabled: !canEdit, onClick: regenerateProposal },
      { sep: true },
      { label: 'Copy link', icon: 'content_copy', onClick: function() {
        var link = location.origin + location.pathname + '?id=' + rootId() + (currentVersion.id !== rootId() ? '&est=' + currentVersion.id : '') + '#proposal';
        if (navigator.clipboard) navigator.clipboard.writeText(link).then(function() { toast('Link copied', 'success'); }, function() { toast(link); });
        else toast(link);
      } }
    ]; });
  }

  async function openProposal() {
    if (!propSettings || propLoadedFor !== currentVersion.id) { loadPropSettings(); propLoadedFor = currentVersion.id; }
    renderPropSettings();
    await renderProposal();
  }

  function renderPropSettings() {
    var host = $('propSettingsHost');
    var s = propSettings;
    var html = '';
    var letter = s.layout !== 'detailed', skipSec = false;
    PROP_SCHEMA.forEach(function(it) {
      if (it.sec) { skipSec = letter && DETAIL_SECS.indexOf(it.sec) >= 0; if (!skipSec) html += '<div class="bp-ps-sec">' + esc(it.sec) + '</div>'; return; }
      if (skipSec || (letter && it.sw && DETAIL_SW.indexOf(it.sw) >= 0)) return;
      if (it.sel) {
        html += '<select class="pc-select" data-psel="' + it.sel + '">' + it.options.map(function(o) { return '<option value="' + o[0] + '"' + (getPath(s, it.sel) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
        return;
      }
      var on = !!getPath(s, it.sw);
      html += '<label class="bp-switch' + (it.disabled ? ' off' : '') + '"' + (it.tip ? ' title="' + esc(it.tip) + '"' : '') + '><input type="checkbox" data-psw="' + it.sw + '"' + (on ? ' checked' : '') + (it.disabled ? ' disabled' : '') + '><i></i><span>' + esc(it.label) + '</span></label>';
    });
    if (letter) {
      html += '<div class="bp-ps-sec">Letter content</div>';
      html += '<div class="pc-field"><label class="pc-label">Mechanical drawings dated</label><input class="pc-input" id="propDrawDate" placeholder="e.g. 2/21/2025"' + (canEdit ? '' : ' disabled') + '></div>';
      html += '<div class="pc-field"><label class="pc-label">Scope of Work <a href="#" id="propScopeReset" class="pc-link" style="font-weight:400;margin-left:6px">reset to automatic</a></label><textarea class="pc-input" id="propScope" rows="9" style="font:inherit;line-height:1.4"' + (canEdit ? '' : ' disabled') + '></textarea></div>';
      html += '<div class="pc-field"><label class="pc-label">Exclusions / Notes <a href="#" id="propExclReset" class="pc-link" style="font-weight:400;margin-left:6px">reset to standard</a></label><textarea class="pc-input" id="propExcl" rows="9" style="font:inherit;line-height:1.4"' + (canEdit ? '' : ' disabled') + '></textarea></div>';
    }
    html += '<div class="bp-ps-sub">Proposal Builder</div>';
    html += '<div class="bp-ps-sec">Cover and Appendix Pages</div>';
    html += '<div class="pc-field"><label class="pc-label">Cover page</label><select class="pc-select" id="propCover"><option value="">None</option></select></div>';
    html += '<div class="pc-field"><label class="pc-label">Appendix page</label><select class="pc-select" id="propAppendix"><option value="">None</option></select></div>';
    html += '<div class="bp-ps-sec">Customer Information</div><div id="propCustHost"></div>';
    html += '<button type="button" class="bp-add-btn" id="propAddContact"' + (canEdit ? '' : ' disabled') + '>' + icon('add', 14) + ' Add Contact</button><div class="bp-cust-mini" id="propContactMini"></div>';
    html += '<div class="bp-ps-sec">Estimator Information</div>';
    html += '<div class="pc-field"><label class="pc-label">Office</label><select class="pc-select" id="propOffice"><option value="">— Select —</option><option>NYC</option><option>Long Island</option><option>NJ</option><option>Westchester</option><option>Other</option></select></div>';
    host.innerHTML = html;

    Array.prototype.forEach.call(host.querySelectorAll('[data-psw]'), function(cb) {
      cb.addEventListener('change', function() {
        var key = cb.getAttribute('data-psw');
        if (key === 'editMode') { toggleEditMode(cb.checked); return; }
        if (!canEdit) { cb.checked = !cb.checked; return viewOnly(); }
        setPath(propSettings, key, cb.checked);
        savePropSettings();
        if (!propSettings.editMode) renderProposal();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-psel]'), function(sel) {
      sel.addEventListener('change', function() {
        if (!canEdit) { sel.value = getPath(propSettings, sel.getAttribute('data-psel')); return viewOnly(); }
        setPath(propSettings, sel.getAttribute('data-psel'), sel.value);
        savePropSettings(); if (!propSettings.editMode) renderProposal();
        if (sel.getAttribute('data-psel') === 'layout') renderPropSettings();
      });
    });
    ['propCover', 'propAppendix'].forEach(function(id) {
      $(id).addEventListener('change', function() {
        if (!canEdit) return viewOnly();
        propSettings[id === 'propCover' ? 'coverFileId' : 'appendixFileId'] = $(id).value || null;
        savePropSettings();
      });
    });
    $('propOffice').value = currentVersion.office || '';
    $('propOffice').addEventListener('change', function() {
      if (!canEdit) return viewOnly();
      var v = $('propOffice').value || null;
      $('ovOffice').value = v || '';
      queueSave('office', v);
      if (!propSettings.editMode) setTimeout(renderProposal, 50);
    });
    $('propAddContact').addEventListener('click', openContactModal);
    renderPropCustomer();
    fillProposalFiles();
    if (letter) fillLetterFields();
  }

  // Letter content fields: drawings date (proposal settings) · scope / exclusions (estimates.scope_summary / exclusions; empty = automatic / standard)
  var letterRenderTimer = null;
  function rerenderSoon() { clearTimeout(letterRenderTimer); letterRenderTimer = setTimeout(function() { if (!propSettings.editMode) renderProposal(); }, 350); }
  async function fillLetterFields() {
    var sc = $('propScope'), ex = $('propExcl'), dd = $('propDrawDate');
    if (!sc || !ex || !dd || !window.NWProposal) return;
    var lines = await loadLines();
    function autoScope() { return NWProposal.buildScope(currentVersion, lines).join('\n'); }
    function stdExcl() { return NWProposal.DEFAULT_EXCLUSIONS.join('\n'); }
    sc.value = (currentVersion.scope_summary || '').trim() || autoScope(); sc.dataset.orig = sc.value;
    ex.value = (currentVersion.exclusions || '').trim() || stdExcl(); ex.dataset.orig = ex.value;
    dd.value = propSettings.drawingsDate || '';
    dd.addEventListener('input', function() {
      if (!canEdit) return;
      propSettings.drawingsDate = dd.value.trim(); savePropSettings(); rerenderSoon();
    });
    function bindArea(el, col, autoFn) {
      el.addEventListener('change', function() {
        if (!canEdit) { el.value = el.dataset.orig; return viewOnly(); }
        var v = el.value.trim();
        var saved = (v && v !== autoFn()) ? v : null;      // text equal to the automatic one stays automatic
        currentVersion[col] = saved; queueSave(col, saved); el.dataset.orig = el.value; rerenderSoon();
      });
    }
    bindArea(sc, 'scope_summary', autoScope);
    bindArea(ex, 'exclusions', stdExcl);
    $('propScopeReset').addEventListener('click', function(ev) {
      ev.preventDefault(); if (!canEdit) return viewOnly();
      currentVersion.scope_summary = null; queueSave('scope_summary', null); sc.value = autoScope(); sc.dataset.orig = sc.value; rerenderSoon();
    });
    $('propExclReset').addEventListener('click', function(ev) {
      ev.preventDefault(); if (!canEdit) return viewOnly();
      currentVersion.exclusions = null; queueSave('exclusions', null); ex.value = stdExcl(); ex.dataset.orig = ex.value; rerenderSoon();
    });
  }
  function renderPropCustomer() {
    var host = $('propCustHost'); if (!host) return;
    var e = currentVersion;
    if (e.client_name) host.innerHTML = '<div class="bp-cust-mini"><b>' + esc(e.client_name) + '</b>' + (canEdit ? '<a href="#" id="propCustChange" class="pc-link" style="text-decoration:none">change</a>' : '') + '</div>';
    else host.innerHTML = '<button type="button" class="bp-add-btn" id="propCustAdd"' + (canEdit ? '' : ' disabled') + '>' + icon('add', 14) + ' Add Customer</button>';
    var a = $('propCustAdd'); if (a) a.addEventListener('click', openCustomerModal);
    var c = $('propCustChange'); if (c) c.addEventListener('click', function(ev) { ev.preventDefault(); openCustomerModal(); });
    var mini = $('propContactMini');
    if (mini) mini.innerHTML = (propSettings && (propSettings.contactName || propSettings.contactEmail)) ? '<b>' + esc(propSettings.contactName || '') + '</b> ' + esc(propSettings.contactEmail || '') : '';
  }
  function openContactModal() {
    if (!canEdit) return viewOnly();
    var body = document.createElement('div');
    body.innerHTML = '<div class="pc-field"><label class="pc-label">Contact name</label><input class="pc-input" id="ctName" value="' + esc(propSettings.contactName || '') + '"></div>' +
      '<div class="pc-field"><label class="pc-label">Contact email</label><input class="pc-input" type="email" id="ctEmail" value="' + esc(propSettings.contactEmail || '') + '"></div>';
    var m = PC.modal({ title: 'Add Contact', body: body, size: 'sm', buttons: [
      { label: 'Cancel', onClick: function() { m.close(); } },
      { label: 'Save', primary: true, onClick: function() {
        propSettings.contactName = (body.querySelector('#ctName').value || '').trim();
        propSettings.contactEmail = (body.querySelector('#ctEmail').value || '').trim();
        savePropSettings(); renderPropCustomer(); if (!propSettings.editMode) renderProposal(); m.close();
      } }
    ] });
  }
  async function fillProposalFiles() {
    var cov = $('propCover'), app = $('propAppendix');
    if (!cov || !app || !propSettings) return;
    if (!docsLoadedOnce) {
      var a = await supabaseClient.from('project_files').select('id, filename, storage_path, content_type').eq('estimate_id', rootId()).order('created_at', { ascending: false });
      attachments = a.error ? [] : (a.data || []);
    }
    var pdfs = attachments.filter(function(f) { return f.storage_path && (/\.pdf$/i.test(f.filename || '') || f.content_type === 'application/pdf'); });
    var opts = '<option value="">None</option>' + pdfs.map(function(f) { return '<option value="' + f.id + '">' + esc(f.filename) + '</option>'; }).join('');
    cov.innerHTML = opts; app.innerHTML = opts;
    cov.value = propSettings.coverFileId || ''; app.value = propSettings.appendixFileId || '';
  }

  async function estimatorEmailFor(name) {
    if (!name) return '';
    if (estimatorEmailCache[name] !== undefined) return estimatorEmailCache[name];
    var q = await supabaseClient.from('profiles').select('email').eq('full_name', name).limit(1).maybeSingle();
    estimatorEmailCache[name] = (q.data && q.data.email) || '';
    return estimatorEmailCache[name];
  }

  async function renderProposal() {
    var paper = $('propPaper');
    if (propSettings.editMode) return;
    if (propSettings.htmlOverride && currentVersion.proposal_html) {
      paper.innerHTML = currentVersion.proposal_html;
      $('propModeLabel').textContent = 'Saved edits (not live)';
      $('propModeLabel').classList.remove('on');
      return;
    }
    if (!window.NWProposal || typeof NWProposal.render !== 'function') { paper.innerHTML = '<div class="pc-empty">nw-proposal.js not loaded.</div>'; return; }
    var lines = await loadLines();
    var email = await estimatorEmailFor(currentVersion.estimator_name);
    try {
      paper.innerHTML = NWProposal.render(currentVersion, lines, propSettings, { estimatorEmail: email, catalogById: {} });
    } catch(e) { paper.innerHTML = '<div class="pc-empty" style="color:#dc2626">Proposal render failed: ' + esc(e.message || e) + '</div>'; }
    $('propModeLabel').textContent = 'Live preview';
    $('propModeLabel').classList.remove('on');
  }

  async function toggleEditMode(on) {
    var paper = $('propPaper');
    if (on && !canEdit) { viewOnly(); var cb = document.querySelector('[data-psw="editMode"]'); if (cb) cb.checked = false; return; }
    propSettings.editMode = on;
    if (on) {
      if (propSettings.htmlOverride && currentVersion.proposal_html) paper.innerHTML = currentVersion.proposal_html;
      paper.setAttribute('contenteditable', 'true');
      $('propToolbar').classList.add('show');
      $('propModeLabel').textContent = 'Edit Mode — changes autosave';
      $('propModeLabel').classList.add('on');
      paper.focus();
    } else {
      paper.removeAttribute('contenteditable');
      $('propToolbar').classList.remove('show');
      // await the pending save first so htmlOverride is set before the re-render (else the live render overwrites the edits on screen)
      if (propDirty) await saveProposalHtml(false);
      await renderProposal();
    }
  }
  function markPropDirty() {
    propDirty = true;
    clearTimeout(propHtmlTimer);
    propHtmlTimer = setTimeout(function() { saveProposalHtml(false); }, 1500);
  }
  async function saveProposalHtml(announce) {
    if (!canEdit) { if (announce) viewOnly(); return; }
    // Only custom edits get stored: saving the live render (Ctrl+S out of habit) would set htmlOverride and
    // silently stop the proposal from following the estimate lines / Detail Settings.
    if (!propSettings || (!propSettings.editMode && !propDirty)) {
      if (announce) toast('Turn on Edit Mode to save custom proposal text');
      return;
    }
    clearTimeout(propHtmlTimer);
    var wasDirty = propDirty;
    var html = $('propPaper').innerHTML;
    var upd = await supabaseClient.from('estimates').update({ proposal_html: html }).eq('id', currentVersion.id);
    if (upd.error) { toast('Save failed: ' + upd.error.message, 'error'); return; }
    currentVersion.proposal_html = html;
    propDirty = false;
    if (wasDirty && !propSettings.htmlOverride) { propSettings.htmlOverride = true; savePropSettings(); }
    if (announce) toast(wasDirty ? 'Proposal saved' : 'No changes to save');
  }
  async function regenerateProposal() {
    if (!canEdit) return viewOnly();
    if (!(await PC.confirm({ title: 'Regenerate from estimate', message: 'Discard the manually edited proposal text and rebuild it from the current estimate lines and Detail Settings?', okLabel: 'Regenerate' }))) return;
    propSettings.htmlOverride = false; propDirty = false;
    if (propSettings.editMode) { propSettings.editMode = false; $('propPaper').removeAttribute('contenteditable'); $('propToolbar').classList.remove('show'); var cb = document.querySelector('[data-psw="editMode"]'); if (cb) cb.checked = false; }
    savePropSettings();
    linesCache = null;
    await renderProposal();
    toast('Proposal regenerated', 'success');
  }

  async function fileBytes(fileId) {
    if (!fileId) return null;
    var f = attachments.find(function(x) { return x.id === fileId; });
    if (!f) { var q = await supabaseClient.from('project_files').select('id, filename, storage_path').eq('id', fileId).maybeSingle(); f = q.data; }
    if (!f || !f.storage_path) return null;
    var r = await supabaseClient.storage.from('project-files').createSignedUrl(f.storage_path, 600);
    if (r.error || !r.data) return null;
    var res = await fetch(r.data.signedUrl);
    return await res.arrayBuffer();
  }
  function proposalFilename(ext) {
    return (currentVersion.quote_number ? 'Q' + currentVersion.quote_number + '_' : '') + (currentVersion.name || 'Proposal').replace(/[^A-Za-z0-9_-]+/g, '_') + '.' + ext;
  }
  async function exportProposalPdf() {
    if (!window.NWProposal || typeof NWProposal.exportPdf !== 'function') { toast('nw-proposal.js not loaded', 'error'); return; }
    if (currentTab !== 'proposal') { setTab('proposal'); await openProposal(); }
    var paper = $('propPaper');
    if (!paper.innerHTML.trim()) { toast('Nothing to export', 'error'); return; }
    toast('Building PDF…');
    try {
      var cover = await fileBytes(propSettings.coverFileId), appendix = await fileBytes(propSettings.appendixFileId);
      await NWProposal.exportPdf(paper, { filename: proposalFilename('pdf'), coverBytes: cover, appendixBytes: appendix });
    } catch(e) { toast('Export failed: ' + (e.message || e), 'error'); }
  }
  async function exportProposalLetter() {
    if (!window.NWProposal || typeof NWProposal.render !== 'function' || typeof NWProposal.exportPdf !== 'function') { toast('nw-proposal.js not loaded', 'error'); return; }
    if (!propSettings) loadPropSettings();
    var host = null;
    try {
      toast('Building PDF…');
      var lines = await loadLines();
      var email = await estimatorEmailFor(currentVersion.estimator_name);
      var st = Object.assign({}, propSettings, { layout: 'letter', editMode: false });
      host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-10000px;top:0;width:8.5in;background:#fff';
      host.innerHTML = NWProposal.render(currentVersion, lines, st, { estimatorEmail: email, catalogById: {} });
      document.body.appendChild(host);
      var cover = await fileBytes(propSettings.coverFileId), appendix = await fileBytes(propSettings.appendixFileId);
      await NWProposal.exportPdf(host.querySelector('#nwpPaper'), { filename: proposalFilename('pdf'), coverBytes: cover, appendixBytes: appendix });
    } catch(e) { toast('Export failed: ' + (e.message || e), 'error'); }
    finally { if (host) host.remove(); }
  }
  async function exportProposalXlsx() {
    if (!window.NWProposal || typeof NWProposal.exportXlsx !== 'function') { toast('nw-proposal.js not loaded', 'error'); return; }
    if (!propSettings) loadPropSettings();
    try { var lines = await loadLines(); await NWProposal.exportXlsx(currentVersion, lines, propSettings); }
    catch(e) { toast('Export failed: ' + (e.message || e), 'error'); }
  }
})();
</script>
