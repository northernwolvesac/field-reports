<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NW Field">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<title>App Support — Northern Wolves AC</title>
<link rel="stylesheet" href="styles.css?v=556">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=556"></script>
<script src="auth.js?v=556"></script>
<style>
  body { background: #f7f8fa; padding-bottom: 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 14px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 20; }
  .top a.back { font-size: 22px; text-decoration: none; color: #111318; padding: 0 6px; }
  .top .ttl { flex: 1; } .top .ttl b { display: block; font-size: 16px; color: #111318; } .top .ttl span { font-size: 12px; color: #6b7280; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 14px 0 4px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .card:hover { border-color: #9ca3af; } .card.on { border-color: #111318; box-shadow: inset 0 0 0 1px #111318; }
  .card b { display: block; font-size: 22px; color: #111318; font-variant-numeric: tabular-nums; } .card span { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
  .card.amb b { color: #b45309; } .card.grn b { color: #15803d; } .card.red b { color: #b91c1c; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .tools input[type=search] { flex: 1; min-width: 200px; padding: 9px 11px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-family: inherit; }
  .btn { width: auto; display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; font-size: 13px; font-weight: 700; border-radius: 9px; cursor: pointer; border: 1px solid #111318; background: #111318; color: #fff; text-decoration: none; white-space: nowrap; }
  .btn.light { background: #fff; color: #111318; border-color: #d1d5db; } .btn.red { background: #fff; color: #b91c1c; border-color: #fecaca; } .btn.grn { background: #15803d; border-color: #15803d; }
  .btn.sm { padding: 5px 9px; font-size: 12px; border-radius: 7px; } .btn:disabled { opacity: .5; cursor: default; }
  .tk { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px; }
  .tk-h { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; cursor: pointer; }
  .tk-h .no { font: 700 13px ui-monospace, Menlo, monospace; color: #6b7280; min-width: 46px; }
  .tk-h .main { flex: 1; min-width: 0; } .tk-h .main b { display: block; font-size: 14px; color: #111318; overflow: hidden; text-overflow: ellipsis; }
  .tk-h .main span { font-size: 12px; color: #6b7280; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; border: 1px solid #d1d5db; color: #374151; white-space: nowrap; }
  .pill.new, .pill.in_progress { border-color: #93c5fd; color: #1d4ed8; } .pill.fixed, .pill.answered, .pill.closed { border-color: #86efac; color: #15803d; }
  .pill.needs_russ { border-color: #fcd34d; color: #b45309; } .pill.approved { border-color: #a5b4fc; color: #4338ca; } .pill.declined, .pill.error { border-color: #fecaca; color: #b91c1c; }
  .tk-b { display: none; border-top: 1px solid #f0f1f3; padding: 12px 14px; font-size: 13px; color: #374151; }
  .tk.open .tk-b { display: block; }
  .tk-b pre { white-space: pre-wrap; word-break: break-word; background: #f7f8fa; border-radius: 8px; padding: 10px; font: 13px/1.45 -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 6px 0 10px; }
  .tk-b .meta { font-size: 12px; color: #6b7280; margin-bottom: 8px; word-break: break-all; }
  .tk-b .hist { font-size: 12px; color: #6b7280; margin-top: 8px; }
  .tk-b img { max-width: 100%; border-radius: 8px; border: 1px solid #e5e7eb; margin: 6px 0; }
  .decide { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .decide input { flex: 1; min-width: 180px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; font-size: 13px; }
  .empty { text-align: center; color: #6b7280; padding: 40px 10px; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #111318; color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 50; }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html" aria-label="Home">‹</a>
  <div class="ttl"><b>App Support</b><span id="sub">Problems &amp; suggestions — handled by the AI support engineer · app.ai.support@northernwolvesac.com</span></div>
  <button class="btn" id="newBtn" type="button">⚑ New ticket</button>
</div>
<div class="wrap">
  <div class="cards" id="cards"></div>
  <div class="tools"><input type="search" id="q" placeholder="Search tickets…"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var sb = window.supabaseClient, me = null, isAdm = false, rows = [], filter = new URLSearchParams(location.search).get('status') || 'open';
  var LABEL = { new: 'New', in_progress: 'In progress', fixed: 'Fixed', answered: 'Answered', needs_russ: 'Needs Ruslan', approved: 'Approved', declined: 'Declined', closed: 'Closed', error: 'Error' };
  var KIND = { bug: 'Bug', idea: 'Suggestion', question: 'Question' };
  var GROUPS = [
    { k: 'open', t: 'Open', test: function (r) { return ['new', 'in_progress', 'approved', 'error'].indexOf(r.status) >= 0; } },
    { k: 'needs_russ', t: 'Needs Ruslan', cls: 'amb', test: function (r) { return r.status === 'needs_russ'; } },
    { k: 'done', t: 'Done', cls: 'grn', test: function (r) { return ['fixed', 'answered', 'closed'].indexOf(r.status) >= 0; } },
    { k: 'declined', t: 'Declined', test: function (r) { return r.status === 'declined'; } },
    { k: 'error', t: 'Errors', cls: 'red', test: function (r) { return r.status === 'error'; } },
    { k: 'all', t: 'All', test: function () { return true; } }
  ];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(s) { if (!s) return ''; var d = new Date(s); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3500); }

  async function load() {
    var r = await sb.from('support_tickets').select('*').order('created_at', { ascending: false }).limit(500);
    if (r.error) { document.getElementById('list').innerHTML = '<div class="empty">' + esc(r.error.message) + '</div>'; return; }
    rows = r.data || []; render();
  }
  function render() {
    var c = document.getElementById('cards');
    c.innerHTML = GROUPS.map(function (g) { var n = rows.filter(g.test).length; return '<div class="card ' + (g.cls || '') + (filter === g.k ? ' on' : '') + '" data-k="' + g.k + '"><b>' + n + '</b><span>' + esc(g.t) + '</span></div>'; }).join('');
    c.querySelectorAll('.card').forEach(function (el) { el.onclick = function () { filter = el.dataset.k; render(); }; });
    var g = GROUPS.filter(function (x) { return x.k === filter; })[0] || GROUPS[0];
    var q = document.getElementById('q').value.trim().toLowerCase();
    var list = rows.filter(g.test).filter(function (r) { return !q || [r.ticket_no, r.title, r.body, r.reporter_name, r.reporter_email, r.resolution].join(' ').toLowerCase().indexOf(q) >= 0; });
    var L = document.getElementById('list');
    if (!list.length) { L.innerHTML = '<div class="empty">' + (rows.length ? 'Nothing here.' : 'No tickets yet. Use the ⚑ button on any page (bottom right) or e-mail app.ai.support@northernwolvesac.com.') + '</div>'; return; }
    L.innerHTML = list.map(function (r) {
      var hist = (r.history || []).slice(-8).map(function (h) { return esc(when(h.at)) + ' — ' + esc(h.event) + (h.status ? ' ' + esc(LABEL[h.status] || h.status) : '') + (h.by ? ' · ' + esc(h.by) : '') + (h.note ? ' · “' + esc(h.note) + '”' : ''); }).join('<br>');
      var adm = isAdm ? '<div class="decide">' +
        (r.status === 'needs_russ' || r.status === 'error' || r.status === 'new' ? '<input placeholder="Note for the AI engineer / the reporter (optional)" data-note="' + r.ticket_no + '"><button class="btn sm grn" data-act="approved" data-no="' + r.ticket_no + '">Approve</button><button class="btn sm red" data-act="declined" data-no="' + r.ticket_no + '">Decline</button>' : '') +
        (r.status === 'error' || r.status === 'new' || r.status === 'approved' ? '<button class="btn sm light" data-act="retry" data-no="' + r.ticket_no + '">Hand off again</button>' : '') + '</div>' : '';
      return '<div class="tk" data-no="' + r.ticket_no + '"><div class="tk-h"><span class="no">T' + r.ticket_no + '</span><div class="main"><b>' + esc(r.title || (r.body || '').slice(0, 90)) + '</b><span>' + esc(KIND[r.kind] || r.kind) + ' · ' + esc(r.reporter_name || r.reporter_email || '') + ' · ' + esc(when(r.created_at)) + (r.source === 'email' ? ' · e-mail' : '') + '</span></div><span class="pill ' + r.status + '">' + esc(LABEL[r.status] || r.status) + '</span></div>' +
        '<div class="tk-b"><pre>' + esc(r.body) + '</pre>' +
        (r.resolution ? '<b>Result</b><pre>' + esc(r.resolution) + '</pre>' : '') +
        '<div class="meta">' + (r.fixed_version ? 'Fixed in ' + esc(r.fixed_version) + ' · ' : '') + (r.page_url ? 'Page: ' + esc(r.page_url) + ' · ' : '') + (r.app_version ? 'App ' + esc(r.app_version) : '') + '</div>' +
        (r.screenshot_path ? '<div data-shot="' + esc(r.screenshot_path) + '"></div>' : '') +
        adm + (hist ? '<div class="hist">' + hist + '</div>' : '') + '</div></div>';
    }).join('');
    L.querySelectorAll('.tk-h').forEach(function (h) { h.onclick = function () { var tk = h.parentNode; tk.classList.toggle('open'); var s = tk.querySelector('[data-shot]'); if (s && !s.dataset.done) { s.dataset.done = 1; sb.storage.from('support-screenshots').createSignedUrl(s.dataset.shot, 3600).then(function (u) { if (u.data) s.innerHTML = '<img alt="screenshot" src="' + esc(u.data.signedUrl) + '">'; }); } }; });
    L.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); act(b.dataset.act, Number(b.dataset.no), b); }; });
  }
  async function act(a, no, btn) {
    var noteEl = document.querySelector('[data-note="' + no + '"]'), note = noteEl ? noteEl.value.trim() : '';
    btn.disabled = true;
    var body = a === 'retry' ? { action: 'retry', ticket_no: no } : { action: 'decide', ticket_no: no, decision: a, note: note };
    var r = await sb.functions.invoke('support', { body: body });
    btn.disabled = false;
    if (r.error || !r.data || !r.data.ok) { toast('Failed: ' + ((r.data && r.data.error) || (r.error && r.error.message) || 'no answer')); return; }
    toast(a === 'approved' ? 'T' + no + ' approved — sent to the AI support engineer' : a === 'declined' ? 'T' + no + ' declined' : 'T' + no + ' handed off again');
    load();
  }
  document.getElementById('q').addEventListener('input', render);
  document.getElementById('newBtn').onclick = function () {
    if (window.NWSupport) return window.NWSupport.open();
    var sc = document.createElement('script'); sc.src = 'nw-support.js'; sc.onload = function () { window.NWSupport.open(); }; document.head.appendChild(sc);
  };
  requireAuth().then(async function () {
    var p = await getAuthProfile(); me = p; isAdm = !!(p && p.role === 'admin');
    if (!isAdm) { filter = filter === 'open' ? 'all' : filter; document.getElementById('sub').textContent = 'Your tickets — answers also come by e-mail from app.ai.support@northernwolvesac.com'; }
    load();
    try { sb.channel('support-tickets').on('postgres_changes', { event: '*', schema: 'public', table: 'support_tickets' }, function () { load(); }).subscribe(); } catch (e) {}
  }).catch(function () {});
})();
</script>
</body>
</html>
