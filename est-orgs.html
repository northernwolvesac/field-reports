<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0696D7">
<title>Organisations — Northern Wolves AC</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js?v=534"></script>
<script src="auth.js?v=534"></script>
<script src="est-org.js?v=534"></script>
<script src="est-engine.js?v=534"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="email-utils.js?v=534"></script>
<script src="nw-email.js?v=534"></script>
<style>
  body { padding-bottom: 40px; }
  .og-wrap { max-width: 1100px; margin: 0 auto; }
  .og-body { padding: 16px; }
  .card { display: block; width: auto; max-width: none; background: var(--nw-card); border: 1px solid var(--nw-border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card > * { width: 100%; }
  .card h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; color: var(--nw-muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=email], input[type=number], select { padding: 8px 10px; border: 1px solid var(--nw-border); border-radius: 8px; font-size: 13px; background: #fff; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--nw-border); background: #fff; font-weight: 700; font-size: 12px; cursor: pointer; color: var(--nw-text); }
  .btn.primary { background: var(--nw-text); color: #fff; border-color: var(--nw-text); }
  .btn.sm { padding: 3px 8px; font-size: 11px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--nw-muted); font-size: 12px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.t th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--nw-muted); border-bottom: 1px solid var(--nw-border); padding: 6px; }
  table.t td { padding: 6px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  .set { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; margin-top: 8px; }
  .set label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--nw-muted); }
  .set input, .set select { width: 100%; box-sizing: border-box; }
  .chip { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 6px; background: #f1f5f9; color: #475569; font-weight: 700; }
  .chip.owner { background: #0f172a; color: #fff; } .chip.admin { background: #e0f2fe; color: #075985; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="og-wrap">
  <div class="header">
    <a href="ai-estimator.html" class="back-btn">&#8592;</a>
    <div class="header-content"><h1>Organisations</h1></div>
    <div class="profile-circle" id="profileCircle">--</div>
  </div>
  <div class="og-body" id="main"><div class="muted">Loading…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
requireAuth().catch(function(){});
// ═══════════════════════════════════════════════════════════════════════
// Organisations of the estimating product (roadmap item 8). An org owner / admin manages members and invites; the global
// admin (profiles.role = admin) creates organisations and can copy NWAC's library (rules, catalog, norms, knowledge notes)
// into a new one. Every product row carries org_id and RLS keeps organisations apart (est-multi-tenant.sql).
// ═══════════════════════════════════════════════════════════════════════
var OG = (function() {
  'use strict';
  var $ = function(id) { return document.getElementById(id); };
  var sb = window.supabaseClient, me = null, globalAdmin = false, orgs = [], members = {}, invites = {}, profiles = {}, cost = {}, tokens = {}, ilog = {}, lastTok = {};
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 3200); }
  function slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40); }

  async function load() {
    var u = await sb.auth.getUser(); me = u.data && u.data.user; if (!me) return;
    var p = await sb.from('profiles').select('role,full_name').eq('id', me.id).maybeSingle(); globalAdmin = !!(p.data && p.data.role === 'admin'); me.name = (p.data && p.data.full_name) || me.email;
    await NWOrg.load();
    var o = await sb.from('est_orgs').select('*').order('name'); orgs = o.data || [];
    var m = await sb.from('est_org_members').select('org_id,user_id,role,created_at'); members = {}; (m.data || []).forEach(function(x) { (members[x.org_id] = members[x.org_id] || []).push(x); });
    try {
      var tk = await sb.from('est_intake_tokens').select('id,org_id,label,notify_emails,created_at,last_used_at,revoked_at').order('created_at', { ascending: false }); tokens = {}; (tk.data || []).forEach(function(x) { (tokens[x.org_id] = tokens[x.org_id] || []).push(x); });
      var lg = await sb.from('est_intake_log').select('id,org_id,from_email,subject,session_id,files,status,note,created_at').order('created_at', { ascending: false }).limit(150); ilog = {}; (lg.data || []).forEach(function(x) { (ilog[x.org_id] = ilog[x.org_id] || []).push(x); });
    } catch (eI) { tokens = {}; ilog = {}; }   // est-intake.sql not run yet: the card then explains it
    var iv = await sb.from('est_org_invites').select('*').is('claimed_at', null); invites = {}; (iv.data || []).forEach(function(x) { (invites[x.org_id] = invites[x.org_id] || []).push(x); });
    var ids = []; Object.keys(members).forEach(function(k) { members[k].forEach(function(x) { ids.push(x.user_id); }); });
    if (ids.length) { var pr = await sb.from('profiles').select('id,full_name,email,role').in('id', ids); profiles = {}; (pr.data || []).forEach(function(x) { profiles[x.id] = x; }); }
    try { var c = await sb.from('est_org_cost').select('*'); cost = {}; (c.data || []).forEach(function(x) { var k = x.org_id; cost[k] = cost[k] || { pages: 0, cost: 0 }; cost[k].pages += Number(x.pages || 0); cost[k].cost += Number(x.cost || 0); }); } catch (e) {}
  }
  function canManage(o) { var mm = (members[o.id] || []).find(function(x) { return x.user_id === me.id; }); return globalAdmin || !!(mm && /^(owner|admin)$/.test(mm.role)); }
  function render() {
    var html = '';
    if (globalAdmin) html += '<div class="card"><h3>New organisation</h3><div class="row"><input type="text" id="newName" placeholder="Company name" style="min-width:260px"><label class="muted"><input type="checkbox" id="newCopy" checked> copy NWAC\'s rules, catalog, norms and knowledge notes</label><button class="btn primary" onclick="OG.create()">Create</button></div><p class="muted">A design partner gets its own organisation: its sessions, benchmark, rules and library are invisible to every other organisation. Invite its estimators by e-mail below; they sign in to the app as usual.</p></div>';
    if (!orgs.length) html += '<div class="card muted">You are not a member of any organisation.</div>';
    orgs.forEach(function(o) {
      var mm = members[o.id] || [], iv = invites[o.id] || [], mg = canManage(o), c = cost[o.id];
      html += '<div class="card"><div class="row" style="justify-content:space-between"><div><b style="font-size:15px">' + esc(o.name) + '</b> <span class="muted">· ' + esc(o.slug) + ' · ' + mm.length + ' member' + (mm.length === 1 ? '' : 's') + (c ? ' · AI reads ' + c.pages + ' sheets, $' + c.cost.toFixed(2) : '') + '</span></div>' +
        (NWOrg.id() !== o.id ? '<button class="btn sm" onclick="NWOrg.set(\'' + o.id + '\')">Work in this organisation</button>' : '<span class="chip">current</span>') + '</div>' +
        '<table class="t" style="margin-top:8px"><thead><tr><th>Member</th><th>E-mail</th><th>Role</th><th>Since</th><th></th></tr></thead><tbody>' +
        mm.map(function(x) { var pf = profiles[x.user_id] || {}; return '<tr><td>' + esc(pf.full_name || '—') + '</td><td class="muted">' + esc(pf.email || '') + '</td><td><span class="chip ' + esc(x.role) + '">' + esc(x.role) + '</span></td><td class="muted">' + String(x.created_at).slice(0, 10) + '</td><td style="text-align:right">' + (mg && x.user_id !== me.id ? '<button class="btn sm" onclick="OG.setRole(\'' + o.id + '\',\'' + x.user_id + '\')">Role</button> <button class="btn sm" onclick="OG.remove(\'' + o.id + '\',\'' + x.user_id + '\')">Remove</button>' : '') + '</td></tr>'; }).join('') +
        iv.map(function(x) { return '<tr><td class="muted">invited</td><td class="muted">' + esc(x.email) + '</td><td><span class="chip">' + esc(x.role) + '</span></td><td class="muted">' + String(x.created_at).slice(0, 10) + '</td><td style="text-align:right">' + (mg ? '<button class="btn sm" onclick="OG.sendInvite(\'' + o.id + '\',\'' + esc(x.email) + '\',\'' + esc(x.role) + '\')" title="E-mail the invitation (again)">✉ Send</button> <button class="btn sm" onclick="OG.uninvite(\'' + x.id + '\')">Cancel</button>' : '') + '</td></tr>'; }).join('') +
        '</tbody></table>' +
        (mg ? '<div class="row" style="margin-top:10px"><input type="email" id="inv-' + o.id + '" placeholder="estimator@company.com" style="min-width:240px"><select id="invr-' + o.id + '"><option value="estimator">estimator</option><option value="admin">admin</option><option value="viewer">viewer</option></select><button class="btn" onclick="OG.invite(\'' + o.id + '\')">Add / invite</button>' +
          (globalAdmin && o.slug !== 'nwac' ? '<button class="btn" onclick="OG.copyLib(\'' + o.id + '\')" title="Copy NWAC\'s rules, catalog, norms and knowledge notes into this organisation">Copy NWAC library</button>' : '') + '</div>' : '') +
        settingsForm(o, mg) + intakeCard(o, mg) + '</div>';
    });
    $('main').innerHTML = html;
  }
  // Estimating settings (est_orgs.settings) — what the AI estimate of this organisation is priced with; an empty field keeps the
  // NWAC standard ($60/h, 20 % overhead / 30 % OFCI, 2 % misc, 8.875 % NY tax, rectangular 1" lining, $2,500 / $1,300 / $2,500 / $2,500)
  var SET_FIELDS = [
    ['labor_rate', 'Labor rate $/h', 'number', 60, 1],
    ['overhead_pct', 'Overhead %', 'pct', 20, 1],
    ['ofci_overhead_pct', 'Overhead % when OFCI', 'pct', 30, 1],
    ['misc_pct', 'Miscellaneous %', 'pct', 2, 1],
    ['tax_rate', 'Sales tax % (material)', 'pct', 8.875, 1],
    ['duct_family', 'Duct family (no spec read)', 'family', 'rect_lined_1', 1],
    ['duct_sd', 'Duct shop drawings $/sheet', 'number', 2500, 1],
    ['pipe_sd', 'Piping shop drawings $/sheet', 'number', 1300, 1],
    ['tab', 'Testing & balancing $/sheet', 'number', 2500, 1],
    ['lift', 'Man-lift / scaffolding $', 'number', 2500, 1]
  ];
  // ─── E-mail intake: a Google Apps Script on a mailbox turns a labelled e-mail with drawings into an AI Estimator session of this organisation ───
  function intakeScript(org, token, notify) {
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    return [
      "// Northern Wolves AC — AI Estimator e-mail intake (Google Apps Script) · organisation: " + org.name,
      "// 1) script.google.com → New project → paste all of this → Save.   2) Select  setup  and press Run (allow Gmail + external requests).",
      "// 3) In Gmail make a label  AI-Bids  and a filter that applies it to bid invitations (e.g. To: bids@yourcompany.com) — or put the label on",
      "//    any e-mail by hand (works from the phone too). Every 10 minutes the labelled e-mails with PDF / ZIP drawings become sessions.",
      "var CFG = {",
      "  url: '" + SUPABASE_URL + "/functions/v1/ai-estimator',",
      "  key: '" + SUPABASE_ANON_KEY + "',",
      "  token: '" + token + "',",
      "  app: '" + base + "ai-estimator.html',",
      "  label: 'AI-Bids', doneLabel: 'AI-Bids-sent',",
      "  notify: '" + String(notify || '').replace(/'/g, '') + "',",
      "  minBytes: 20 * 1024, maxBytes: 45 * 1024 * 1024",
      "};",
      "function setup() {",
      "  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });",
      "  ScriptApp.newTrigger('run').timeBased().everyMinutes(10).create();",
      "  var r = call_({ action: 'intake_ping', token: CFG.token });",
      "  Logger.log(r.ok ? 'Connected to: ' + r.org + ' — now label an e-mail AI-Bids' : 'NOT connected: ' + r.error);",
      "  if (r.ok) run();",
      "}",
      "function call_(p) {",
      "  var r = UrlFetchApp.fetch(CFG.url, { method: 'post', contentType: 'application/json', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key }, payload: JSON.stringify(p), muteHttpExceptions: true });",
      "  try { return JSON.parse(r.getContentText()); } catch (e) { return { ok: false, error: r.getResponseCode() + ' ' + r.getContentText().slice(0, 200) }; }",
      "}",
      "function run() {",
      "  var label = GmailApp.getUserLabelByName(CFG.label); if (!label) return;",
      "  var done = GmailApp.getUserLabelByName(CFG.doneLabel) || GmailApp.createLabel(CFG.doneLabel);",
      "  label.getThreads(0, 8).forEach(function (th) {",
      "    var msgs = th.getMessages(), ok = true, made = 0;",
      "    msgs.forEach(function (m) { var r = handle_(m, false); if (r === false) ok = false; else if (r === 'session') made++; });",
      "    if (ok && !made && msgs.length) { var r2 = handle_(msgs[0], true); if (r2 === false) ok = false; }   // no attachments anywhere: a bid sent as links",
      "    if (ok) { th.removeLabel(label); th.addLabel(done); }",
      "  });",
      "}",
      "function handle_(m, linksOnly) {",
      "  var files = [], skipped = [];",
      "  function add(b, n) {",
      "    var low = String(n).toLowerCase(), bytes = b.getBytes();",
      "    if (!/\\.pdf$/.test(low) && String(b.getContentType()).indexOf('pdf') < 0) { skipped.push({ name: n, why: 'not a PDF' }); return; }",
      "    if (bytes.length < CFG.minBytes) { skipped.push({ name: n, why: 'too small (logo / signature?)' }); return; }",
      "    if (bytes.length > CFG.maxBytes) { skipped.push({ name: n, why: 'over 45 MB — use the link or upload it by hand' }); return; }",
      "    files.push({ bytes: bytes, name: String(n).split('/').pop(), size: bytes.length });",
      "  }",
      "  m.getAttachments({ includeInlineImages: false, includeAttachments: true }).forEach(function (a) {",
      "    var n = a.getName(), t = String(a.getContentType()).toLowerCase();",
      "    if (/\\.zip$/i.test(n) || t.indexOf('zip') >= 0) { try { Utilities.unzip(a.copyBlob()).forEach(function (b) { add(b, n + '/' + b.getName()); }); } catch (e) { skipped.push({ name: n, why: 'zip not readable' }); } }",
      "    else add(a, n);",
      "  });",
      "  if (!files.length && !linksOnly) return 'none';",
      "  var body = m.getPlainBody() || '', links = [];",
      "  (body.match(/https?:\\/\\/[^\\s<>\")\\]]+/g) || []).forEach(function (u) { if (!/unsubscribe|\\.(png|jpe?g|gif)(\\?|$)|mailto:/i.test(u) && links.indexOf(u) < 0) links.push(u); });",
      "  var b = call_({ action: 'intake_begin', token: CFG.token, message_id: m.getHeader('Message-ID') || m.getId(), from: m.getFrom(), subject: m.getSubject(), text: body, links: links,",
      "    files: files.map(function (f) { return { name: f.name, size: f.size }; }), received_at: m.getDate().toISOString() });",
      "  if (!b.ok) { Logger.log('intake_begin failed: ' + b.error); return false; }",
      "  if (b.duplicate) return 'session';",
      "  var up = [];",
      "  (b.uploads || []).forEach(function (u, i) {",
      "    var r = UrlFetchApp.fetch(u.url, { method: 'put', contentType: 'application/pdf', payload: files[i].bytes, headers: { 'x-upsert': 'true' }, muteHttpExceptions: true });",
      "    if (r.getResponseCode() < 300) up.push(u.file_id); else Logger.log('upload failed ' + u.name + ': ' + r.getResponseCode() + ' ' + r.getContentText().slice(0, 120));",
      "  });",
      "  var f2 = call_({ action: 'intake_finish', token: CFG.token, session_id: b.session_id, uploaded: up, skipped: skipped });",
      "  if (CFG.notify) { try { GmailApp.sendEmail(CFG.notify, 'New bid in the AI Estimator: ' + (b.name || m.getSubject()), 'From: ' + m.getFrom() + '\\nFiles: ' + up.length + (skipped.length ? ' (left out: ' + skipped.map(function (s) { return s.name + ' — ' + s.why; }).join('; ') + ')' : '') + '\\n\\nOpen it: ' + CFG.app + '?s=' + b.session_id); } catch (e) {} }",
      "  return f2.ok ? 'session' : false;",
      "}"
    ].join('\n');
  }
  function intakeCard(o, mg) {
    if (!mg) return '';
    var tk = tokens[o.id] || [], lg = ilog[o.id] || [], lt = lastTok[o.id];
    var h = '<div class="row" style="margin-top:16px;justify-content:space-between"><b style="font-size:12px">E-mail intake</b><span class="muted">a bid e-mailed with drawings becomes an AI Estimator session of ' + esc(o.name) + '</span></div>';
    if (lt) h += '<div class="card" style="margin:8px 0;background:#fffbeb"><b>New token — copy the script now, the token is not shown again.</b><div class="muted" style="margin:4px 0">Paste it into script.google.com on the Google account whose Gmail receives the bid invitations; the steps are at the top of the script.</div>' +
      '<textarea id="isc-' + o.id + '" readonly style="width:100%;height:150px;font:11px/1.4 ui-monospace,Consolas,monospace">' + esc(intakeScript(o, lt.token, lt.notify)) + '</textarea><div class="row" style="margin-top:6px"><button class="btn primary sm" onclick="OG.copyScript(\'' + o.id + '\')">Copy script</button><button class="btn sm" onclick="OG.hideScript(\'' + o.id + '\')">I copied it</button></div></div>';
    h += '<div class="row" style="margin-top:6px"><input type="text" id="itl-' + o.id + '" placeholder="Label (e.g. bids@ mailbox)" style="min-width:180px"><input type="text" id="itn-' + o.id + '" placeholder="Notify e-mails (optional)" style="min-width:220px"><button class="btn" onclick="OG.createToken(\'' + o.id + '\')">New intake token</button></div>';
    if (tokens && !Object.keys(tokens).length && !lg.length && window.__intakeMissing) h += '<div class="muted" style="margin-top:6px">Run est-intake.sql in the Supabase SQL editor first.</div>';
    if (tk.length) h += '<table class="t" style="margin-top:8px"><thead><tr><th>Token</th><th>Created</th><th>Last used</th><th>Notifies</th><th></th></tr></thead><tbody>' + tk.map(function(x) { return '<tr><td>' + esc(x.label || '(no label)') + (x.revoked_at ? ' <span class="chip">revoked</span>' : '') + '</td><td class="muted">' + String(x.created_at).slice(0, 10) + '</td><td class="muted">' + (x.last_used_at ? String(x.last_used_at).replace('T', ' ').slice(0, 16) : 'never') + '</td><td class="muted">' + esc(x.notify_emails || '') + '</td><td style="text-align:right">' + (x.revoked_at ? '' : '<button class="btn sm" onclick="OG.revokeToken(\'' + x.id + '\')">Revoke</button>') + '</td></tr>'; }).join('') + '</tbody></table>';
    if (lg.length) h += '<table class="t" style="margin-top:8px"><thead><tr><th>Received</th><th>From</th><th>Subject</th><th>Files</th><th></th></tr></thead><tbody>' + lg.slice(0, 8).map(function(x) { return '<tr><td class="muted">' + String(x.created_at).replace('T', ' ').slice(0, 16) + '</td><td class="muted">' + esc(String(x.from_email || '').replace(/<.*$/, '').trim()) + '</td><td>' + esc(String(x.subject || '').slice(0, 60)) + '</td><td>' + x.files + (x.status === 'failed' ? ' <span class="chip">failed</span>' : '') + '</td><td style="text-align:right">' + (x.session_id ? '<a href="ai-estimator.html?s=' + x.session_id + '">open</a>' : '') + '</td></tr>'; }).join('') + '</tbody></table>';
    return h;
  }
  async function createToken(orgId) {
    var label = ($('itl-' + orgId) || {}).value || '', notify = ($('itn-' + orgId) || {}).value || '';
    var r = await sb.rpc('est_intake_create_token', { p_org: orgId, p_label: label, p_notify: notify });
    if (r.error) { toast(/function .* does not exist|est_intake/i.test(r.error.message) ? 'Run est-intake.sql in the Supabase SQL editor first' : r.error.message); return; }
    lastTok[orgId] = { token: r.data, notify: notify }; await load(); render();
  }
  function copyScript(orgId) { var el = $('isc-' + orgId); if (!el) return; el.select(); try { document.execCommand('copy'); toast('Script copied — paste it into script.google.com'); } catch (e) { toast('Select the text and copy it'); } }
  function hideScript(orgId) { delete lastTok[orgId]; render(); }
  async function revokeToken(id) { if (!confirm('Revoke this token? The mailbox script stops working until you give it a new token.')) return; var r = await sb.rpc('est_intake_revoke', { p_id: id }); if (r.error) { toast(r.error.message); return; } await load(); render(); }
  function settingsForm(o, mg) {
    var s = o.settings || {}, fams = (window.NWEngine && NWEngine.DUCT_FAMILIES) || {};
    var html = '<div class="row" style="margin-top:14px;justify-content:space-between"><b style="font-size:12px">Estimating settings</b><span class="muted">used by the AI estimate of this organisation — empty = NWAC standard</span></div><div class="set">';
    SET_FIELDS.forEach(function(f) {
      var id = 'st-' + f[0] + '-' + o.id, v = s[f[0]];
      if (f[2] === 'family') {
        html += '<label>' + f[1] + '<select id="' + id + '"' + (mg ? '' : ' disabled') + '><option value="">standard — ' + esc((fams[f[3]] || {}).label || f[3]) + '</option>' +
          Object.keys(fams).map(function(k) { return '<option value="' + k + '"' + (v === k ? ' selected' : '') + '>' + esc(fams[k].label) + '</option>'; }).join('') + '</select></label>';
      } else {
        var shown = (v === null || v === undefined || v === '') ? '' : (f[2] === 'pct' ? Math.round(Number(v) * 100000) / 1000 : Number(v));
        html += '<label>' + f[1] + '<input type="number" step="any" id="' + id + '" value="' + shown + '" placeholder="' + f[3] + '"' + (mg ? '' : ' disabled') + '></label>';
      }
    });
    html += '</div>' + (mg ? '<div class="row" style="margin-top:8px"><button class="btn primary sm" onclick="OG.saveSettings(\'' + o.id + '\')">Save settings</button></div>' : '');
    return html;
  }
  async function saveSettings(orgId) {
    var o = orgs.find(function(x) { return x.id === orgId; }); if (!o) return;
    var s = Object.assign({}, o.settings || {});
    SET_FIELDS.forEach(function(f) {
      var el = $('st-' + f[0] + '-' + orgId); if (!el) return;
      var raw = (el.value || '').trim();
      if (raw === '') { delete s[f[0]]; return; }
      if (f[2] === 'family') { s[f[0]] = raw; return; }
      var n = Number(raw); if (!isFinite(n) || n < 0) { toast(f[1] + ': not a number'); throw new Error('bad'); }
      s[f[0]] = f[2] === 'pct' ? Math.round(n * 100000) / 10000000 : n;
    });
    var r = await sb.from('est_orgs').update({ settings: s }).eq('id', orgId);
    if (r.error) { toast(r.error.message); return; }
    o.settings = s; toast('Settings saved — the next “Price it” uses them');
  }
  async function create() {
    var name = ($('newName').value || '').trim(); if (!name) { toast('Name?'); return; }
    var r = await sb.from('est_orgs').insert({ name: name, slug: slugify(name) || ('org-' + Date.now()), created_by: me.id }).select().single();
    if (r.error) { toast(r.error.message); return; }
    if ($('newCopy').checked) { var c = await sb.rpc('est_copy_library', { src: '11111111-1111-4111-8111-111111111111', dst: r.data.id }); if (c.error) toast('Library copy: ' + c.error.message); else toast('Created — library copied: ' + JSON.stringify(c.data)); }
    else toast('Created');
    await load(); render();
  }
  async function invite(orgId) {
    var email = ($('inv-' + orgId).value || '').trim().toLowerCase(), role = $('invr-' + orgId).value; if (!email) { toast('E-mail?'); return; }
    var pf = await sb.from('profiles').select('id').ilike('email', email).maybeSingle();
    var r = pf.data ? await sb.from('est_org_members').upsert({ org_id: orgId, user_id: pf.data.id, role: role }) : await sb.from('est_org_invites').upsert({ org_id: orgId, email: email, role: role, invited_by: me.id }, { onConflict: 'org_id,email' });
    if (r.error) { toast(r.error.message); return; }
    toast(pf.data ? 'Added as ' + role : 'Invited — the membership starts on their first visit'); await load(); render();
    if (!pf.data) { var org = orgs.find(function(x) { return x.id === orgId; }); if (org && confirm('E-mail the invitation to ' + email + ' now?\n\nThey get the sign-up link; the invitation is claimed when they sign in with this address.')) await sendInvite(orgId, email, role); }
  }
  // The invitation e-mail (branded, through EmailJS): what the product is, which organisation invited them, and the two steps —
  // create the account on login.html with THIS e-mail address, sign in; est_claim_invites turns the account into a member (and a partner
  // outside NWAC) on the first visit. The sender's name and the organisation go in the body; the link is a button.
  async function sendInvite(orgId, email, role) {
    var org = orgs.find(function(x) { return x.id === orgId; }); if (!org) return;
    if (!window.nwSendBrandedEmail || !window.NWEmail) { toast('E-mail helper did not load — reload the page'); return; }
    var link = location.origin + location.pathname.replace(/[^\/]*$/, '') + 'login.html';
    var body = 'Hello,\n\n' + (me.name || 'A colleague') + ' invited you to the AI Estimator of ' + org.name + ' as ' + role + '. ' +
      'It reads mechanical drawings and specs, measures ducts, pipes and air outlets, and builds a priced breakdown for you to review.\n\n' +
      'To get in:\n' +
      '1. Open ' + link + ' and choose Sign Up — use this e-mail address (' + email + '), the invitation is tied to it.\n' +
      '2. Sign in. Your account joins ' + org.name + ' on the first visit and the AI Estimator opens.\n\n' +
      'Reply to this e-mail if anything does not work.\n\nBest regards,\n' + (me.name || '') + '\n' + org.name;
    try {
      await nwSendBrandedEmail({ to: email, subject: 'Invitation to the AI Estimator — ' + org.name, bodyText: body, reportType: 'Invitation', title: 'AI Estimator invitation', subtitle: org.name,
        senderName: me.name || '', files: [{ label: 'Create your account', url: link, primary: true, plain: 'Sign up' }] });
      await sb.from('est_org_invites').update({ invited_by: me.id }).eq('org_id', orgId).ilike('email', email);
      toast('Invitation e-mailed to ' + email);
    } catch (e) { toast('E-mail failed: ' + (e && (e.text || e.message) || e)); }
  }
  async function setRole(orgId, userId) {
    var role = prompt('Role: owner, admin, estimator or viewer', 'estimator'); if (!role || !/^(owner|admin|estimator|viewer)$/.test(role)) return;
    var r = await sb.from('est_org_members').update({ role: role }).eq('org_id', orgId).eq('user_id', userId); if (r.error) { toast(r.error.message); return; } await load(); render();
  }
  async function remove(orgId, userId) { if (!confirm('Remove this member from the organisation?')) return; var r = await sb.from('est_org_members').delete().eq('org_id', orgId).eq('user_id', userId); if (r.error) { toast(r.error.message); return; } await load(); render(); }
  async function uninvite(id) { var r = await sb.from('est_org_invites').delete().eq('id', id); if (r.error) { toast(r.error.message); return; } await load(); render(); }
  async function copyLib(orgId) { if (!confirm('Copy NWAC\'s rules, catalog, norms and knowledge notes into this organisation? Existing rows stay.')) return; var c = await sb.rpc('est_copy_library', { src: '11111111-1111-4111-8111-111111111111', dst: orgId }); if (c.error) toast(c.error.message); else toast('Copied: ' + JSON.stringify(c.data)); }
  (async function() { try { await load(); render(); } catch (e) { $('main').innerHTML = '<div class="card">' + esc(e.message || e) + '</div>'; } })();
  return { create: create, invite: invite, sendInvite: sendInvite, setRole: setRole, remove: remove, uninvite: uninvite, copyLib: copyLib, saveSettings: saveSettings, createToken: createToken, copyScript: copyScript, hideScript: hideScript, revokeToken: revokeToken };
})();
</script>
